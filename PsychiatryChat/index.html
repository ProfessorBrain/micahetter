<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c2e">
  <title>PsychiatryChat - A longitudinal communication game</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff8ec;
      --muted: #c9c5b9;
      --dim: #8fa6a2;
      --night: #071b1e;
      --night-2: #102c2e;
      --panel: rgba(10, 30, 31, .92);
      --panel-solid: #102a2b;
      --line: rgba(242, 208, 151, .22);
      --gold: #efc47e;
      --gold-2: #b77b45;
      --sage: #8eb7a7;
      --rose: #d99b91;
      --focus: #ffe5a8;
      --shadow: 0 24px 80px rgba(0, 0, 0, .36);
      --radius: 24px;
      --text-scale: 1;
      font-family: "Segoe UI", Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--night); font-size: calc(16px * var(--text-scale)); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(85, 137, 123, .24), transparent 34rem),
        radial-gradient(circle at 86% 24%, rgba(190, 122, 74, .16), transparent 28rem),
        linear-gradient(145deg, #06171a 0%, #0c292a 56%, #173739 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .17;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
      z-index: 10;
    }

    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    .skip-link {
      position: fixed;
      left: 1rem;
      top: -4rem;
      z-index: 100;
      padding: .7rem 1rem;
      color: #0a2021;
      background: var(--focus);
      border-radius: 0 0 .6rem .6rem;
    }
    .skip-link:focus { top: 0; }
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    [hidden] { display: none !important; }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
      min-height: 68px;
      padding: .7rem clamp(1rem, 4vw, 3.5rem);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      background: rgba(6, 23, 25, .8);
      backdrop-filter: blur(18px);
    }
    .brand-button, .icon-button {
      border: 0;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
    }
    .brand-button {
      justify-self: start;
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: .5rem;
      font-weight: 760;
      letter-spacing: -.02em;
    }
    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      color: #163233;
      background: var(--gold);
      border-radius: 50% 50% 50% 16%;
      transform: rotate(-8deg);
    }
    .chapter-label {
      color: var(--muted);
      text-align: center;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .icon-button {
      justify-self: end;
      min-width: 48px;
      min-height: 44px;
      padding: .6rem .85rem;
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .icon-button:hover { background: rgba(255, 255, 255, .07); }

    #app { min-height: 100vh; }
    .screen {
      position: relative;
      min-height: 100vh;
      padding: clamp(1.2rem, 5vw, 4rem);
      isolation: isolate;
    }
    .eyebrow {
      margin: 0 0 .75rem;
      color: var(--gold);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, .display {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      letter-spacing: -.035em;
    }
    h1 { font-size: clamp(3.4rem, 9vw, 8.5rem); line-height: .88; }
    h2 { font-size: clamp(2.25rem, 5vw, 4.6rem); line-height: 1; }
    h3 { font-size: 1rem; }
    .lede {
      max-width: 43rem;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.28rem);
      line-height: 1.65;
    }
    .micro { color: var(--dim); font-size: .78rem; line-height: 1.5; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .42rem .72rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .pill::before {
      content: "";
      width: .45rem;
      height: .45rem;
      background: var(--sage);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(142, 183, 167, .12);
    }
    .button-row { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; }
    .primary, .secondary, .quiet-button {
      min-height: 50px;
      padding: .85rem 1.15rem;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .primary {
      color: #112928;
      background: var(--gold);
      box-shadow: 0 10px 30px rgba(239, 196, 126, .16);
      font-weight: 800;
    }
    .primary:hover { transform: translateY(-2px); background: #ffda9b; }
    .secondary {
      color: var(--ink);
      background: rgba(255, 255, 255, .06);
      border-color: var(--line);
      font-weight: 700;
    }
    .secondary:hover { transform: translateY(-2px); background: rgba(255, 255, 255, .1); }
    .quiet-button {
      min-height: 40px;
      padding: .55rem .8rem;
      color: var(--muted);
      background: transparent;
      border-color: rgba(255, 255, 255, .12);
      font-size: .82rem;
    }
    .quiet-button:hover { color: var(--ink); border-color: var(--gold); }

    /* Opening */
    .title-screen {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, .9fr);
      align-items: center;
      gap: clamp(2rem, 7vw, 8rem);
      overflow: hidden;
    }
    .title-copy { z-index: 2; max-width: 54rem; }
    .title-copy h1 span { display: block; color: var(--gold); font-style: italic; }
    .title-actions { margin: 2rem 0 1.25rem; }
    .title-visual {
      position: relative;
      align-self: stretch;
      min-height: 580px;
    }
    .window {
      position: absolute;
      inset: 8% 0 5% 0;
      overflow: hidden;
      border: 1px solid rgba(255, 233, 194, .2);
      border-radius: 45% 45% 12px 12px;
      background:
        linear-gradient(90deg, transparent 49.5%, rgba(12, 34, 35, .72) 49.5%, rgba(12, 34, 35, .72) 50.5%, transparent 50.5%),
        linear-gradient(180deg, transparent 60%, rgba(12, 34, 35, .72) 60%, rgba(12, 34, 35, .72) 61%, transparent 61%),
        radial-gradient(circle at 65% 26%, #f1c785 0 2.4rem, rgba(241, 199, 133, .13) 2.5rem 7rem, transparent 7.1rem),
        linear-gradient(#143d40 0 62%, #274848 62% 100%);
      box-shadow: inset 0 0 90px rgba(0, 0, 0, .33), var(--shadow);
    }
    .window::before, .window::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 42%;
      clip-path: polygon(0 70%, 9% 55%, 16% 64%, 23% 33%, 32% 61%, 44% 45%, 54% 66%, 66% 35%, 78% 64%, 88% 46%, 100% 65%, 100% 100%, 0 100%);
      background: #0d282a;
    }
    .window::after {
      height: 34%;
      clip-path: polygon(0 62%, 15% 40%, 28% 70%, 43% 35%, 55% 68%, 72% 43%, 86% 64%, 100% 45%, 100% 100%, 0 100%);
      background: #071a1c;
    }
    .lamp {
      position: absolute;
      right: 5%;
      bottom: 6%;
      width: 46%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239, 196, 126, .24), transparent 68%);
      filter: blur(8px);
    }
    .title-note {
      position: absolute;
      right: -1rem;
      bottom: 10%;
      width: min(330px, 75%);
      padding: 1.4rem;
      color: #342719;
      background: #e8d4ad;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
      transform: rotate(-2deg);
    }
    .title-note p { margin: 0; font-family: Georgia, serif; font-size: 1.05rem; line-height: 1.55; }
    .title-note small { display: block; margin-top: 1rem; font: 700 .68rem/1 "Segoe UI", sans-serif; letter-spacing: .13em; text-transform: uppercase; }

    /* Selection */
    .selection-screen { padding-top: clamp(3rem, 8vw, 6rem); }
    .selection-head {
      display: flex;
      justify-content: space-between;
      gap: 2rem;
      align-items: end;
      max-width: 1280px;
      margin: 0 auto 2rem;
    }
    .selection-head h1 { margin-bottom: .7rem; font-size: clamp(3rem, 7vw, 6.5rem); }
    .patient-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      max-width: 1280px;
      margin: 0 auto;
    }
    .patient-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 520px;
      overflow: hidden;
      padding: 0;
      color: var(--ink);
      text-align: left;
      background: rgba(11, 37, 38, .72);
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: var(--radius);
      cursor: pointer;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .14);
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
    }
    .patient-card:hover { transform: translateY(-6px); border-color: rgba(239, 196, 126, .58); box-shadow: var(--shadow); }
    .card-art {
      position: relative;
      display: grid;
      height: 230px;
      place-items: end center;
      overflow: hidden;
      background: var(--card-gradient);
    }
    .card-art::before {
      content: "";
      position: absolute;
      width: 200px;
      height: 200px;
      top: 20px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
    }
    .mini-portrait {
      position: relative;
      width: 145px;
      height: 170px;
    }
    .mini-portrait::before {
      content: "";
      position: absolute;
      left: 39px;
      top: 12px;
      width: 70px;
      height: 88px;
      border-radius: 46% 46% 42% 42%;
      background: var(--skin);
      box-shadow: inset 0 7px 0 7px var(--hair);
    }
    .mini-portrait::after {
      content: "";
      position: absolute;
      inset: 91px 4px -20px;
      border-radius: 48% 48% 0 0;
      background: var(--shirt);
    }
    .card-copy { display: flex; flex: 1; flex-direction: column; padding: 1.4rem; }
    .card-number { color: var(--gold); font-size: .7rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .card-copy h2 { margin: .5rem 0 .35rem; font-size: 2.2rem; }
    .card-meta { color: var(--muted); font-size: .88rem; }
    .card-concern { margin: 1.25rem 0 .8rem; font-size: 1.08rem; line-height: 1.5; }
    .themes { display: flex; flex-wrap: wrap; gap: .42rem; margin-top: auto; padding-top: 1rem; }
    .theme {
      padding: .35rem .58rem;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px;
      color: var(--muted);
      font-size: .7rem;
    }
    .availability { margin-top: 1.1rem; color: var(--gold); font-size: .76rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }

    /* Case intro */
    .intro-screen {
      display: grid;
      grid-template-columns: minmax(280px, .8fr) minmax(0, 1.2fr);
      gap: clamp(2rem, 7vw, 7rem);
      align-items: center;
      max-width: 1180px;
      margin: auto;
    }
    .intro-portrait {
      display: grid;
      min-height: 580px;
      place-items: end center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 45% 45% var(--radius) var(--radius);
      background: radial-gradient(circle at 50% 22%, rgba(239,196,126,.22), transparent 18rem), linear-gradient(#244849, #102a2b);
      box-shadow: var(--shadow);
    }
    .intro-portrait .portrait-svg { width: min(90%, 440px); }
    .intro-copy { max-width: 620px; }
    .intro-copy h1 { margin-bottom: .5rem; font-size: clamp(3rem, 7vw, 6rem); }
    .profile-line { color: var(--gold); font-weight: 700; }
    .case-opening {
      margin: 1.35rem 0;
      padding: 1.2rem 1.3rem;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      background: rgba(255,255,255,.035);
    }
    .case-opening h2 {
      margin-bottom: .8rem;
      font: 1.45rem/1.2 Georgia, serif;
      letter-spacing: -.02em;
    }
    .case-opening p { color: var(--muted); line-height: 1.58; }
    .case-opening p:last-child { margin-bottom: 0; }
    .opening-quote {
      margin: 1rem 0 0;
      padding-left: 1rem;
      border-left: 2px solid var(--gold);
      color: var(--ink) !important;
      font: 1.05rem/1.55 Georgia, serif;
    }
    .notice {
      margin: 1.5rem 0;
      padding: 1.1rem 1.2rem;
      border-left: 3px solid var(--rose);
      border-radius: 0 12px 12px 0;
      color: var(--muted);
      background: rgba(217, 155, 145, .08);
      line-height: 1.55;
    }

    /* Encounter */
    .encounter-screen { padding: 68px 0 0; overflow: hidden; }
    .room {
      position: relative;
      min-height: calc(100vh - 68px);
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(3,16,18,.05), rgba(3,16,18,.35)),
        radial-gradient(circle at 68% 21%, rgba(239, 196, 126, .2), transparent 19rem),
        linear-gradient(118deg, #143b3c 0 62%, #102f31 62% 100%);
    }
    .room::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 32%;
      background: linear-gradient(95deg, #132d2e, #0c2224);
      clip-path: polygon(0 24%, 52% 8%, 100% 35%, 100% 100%, 0 100%);
    }
    .room-window {
      position: absolute;
      top: 8%;
      right: 5%;
      width: min(30vw, 390px);
      height: min(39vh, 360px);
      border: 12px solid #0e292a;
      background:
        linear-gradient(90deg, transparent 49%, rgba(14,41,42,.9) 49% 52%, transparent 52%),
        linear-gradient(180deg, transparent 52%, rgba(14,41,42,.9) 52% 55%, transparent 55%),
        radial-gradient(circle at 75% 23%, #f0c27b 0 1.4rem, transparent 1.5rem),
        linear-gradient(#1d5052, #315a59);
      box-shadow: 0 18px 60px rgba(0,0,0,.25);
      opacity: .78;
    }
    .plant {
      position: absolute;
      right: 3%;
      bottom: 22%;
      width: 120px;
      height: 180px;
      opacity: .45;
    }
    .plant::before {
      content: "";
      position: absolute;
      left: 55px;
      top: 15px;
      width: 5px;
      height: 150px;
      background: #6f8e78;
      transform: rotate(4deg);
    }
    .plant::after {
      content: "";
      position: absolute;
      inset: 5px 12px 60px;
      background: #587b68;
      clip-path: polygon(50% 100%, 42% 70%, 5% 52%, 41% 53%, 10% 17%, 48% 40%, 54% 0, 60% 42%, 94% 18%, 67% 56%, 100% 54%, 62% 72%);
    }
    .relationship-meters {
      position: absolute;
      z-index: 5;
      top: 1.2rem;
      right: clamp(1rem, 2vw, 2rem);
      width: 150px;
      padding: .75rem;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: rgba(6, 23, 25, .78);
      box-shadow: 0 16px 42px rgba(0,0,0,.22);
      backdrop-filter: blur(14px);
    }
    .relationship-title {
      margin: 0 0 .65rem;
      color: var(--muted);
      font-size: .58rem;
      font-weight: 850;
      letter-spacing: .14em;
      text-align: center;
      text-transform: uppercase;
    }
    .meter-list { display: grid; gap: .5rem; }
    .meter-item {
      position: relative;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: .55rem;
      align-items: center;
      min-height: 57px;
      padding: .3rem;
      border-radius: 10px;
    }
    .meter-item:hover, .meter-item:focus { background: rgba(255,255,255,.055); }
    .meter-glass {
      position: relative;
      width: 32px;
      height: 50px;
      overflow: hidden;
      border: 2px solid rgba(235,248,245,.72);
      border-top-width: 3px;
      border-radius: 3px 3px 9px 9px;
      background: rgba(218,244,239,.05);
      box-shadow: inset 5px 0 8px rgba(255,255,255,.05);
    }
    .meter-glass::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: -2px;
      left: -3px;
      width: 34px;
      height: 4px;
      border: 1px solid rgba(235,248,245,.7);
      border-radius: 50%;
    }
    .meter-water {
      position: absolute;
      right: 2px;
      bottom: 2px;
      left: 2px;
      height: var(--level);
      max-height: calc(100% - 4px);
      border-radius: 1px 1px 6px 6px;
      background: var(--meter-color);
      background: linear-gradient(180deg, color-mix(in srgb, var(--meter-color) 76%, white), var(--meter-color));
      opacity: .9;
      transition: height .65s cubic-bezier(.22,.9,.3,1);
    }
    .meter-water::before {
      content: "";
      position: absolute;
      top: -3px;
      left: -4px;
      width: calc(100% + 8px);
      height: 7px;
      border-radius: 50%;
      background: var(--meter-color);
      background: color-mix(in srgb, var(--meter-color) 70%, white);
      opacity: .92;
    }
    .meter-copy { min-width: 0; }
    .meter-name {
      display: block;
      color: var(--ink);
      font-size: .67rem;
      font-weight: 800;
      line-height: 1.15;
    }
    .meter-status {
      display: block;
      margin-top: .2rem;
      color: var(--dim);
      font-size: .57rem;
      line-height: 1.1;
    }
    .meter-change { font-weight: 900; }
    .meter-change.up { color: var(--sage); }
    .meter-change.down { color: var(--rose); }
    .meter-tooltip {
      position: absolute;
      right: calc(100% + .7rem);
      top: 50%;
      width: 230px;
      padding: .7rem .8rem;
      color: var(--muted);
      background: #0b2426;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      font-size: .72rem;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) translateX(6px);
      transition: opacity .15s ease, transform .15s ease;
    }
    .meter-item:hover .meter-tooltip, .meter-item:focus .meter-tooltip {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }
    .portrait-wrap {
      position: absolute;
      left: clamp(2%, 9vw, 11%);
      bottom: 160px;
      display: grid;
      width: min(34vw, 360px);
      height: min(64vh, 590px);
      place-items: end center;
      filter: drop-shadow(0 25px 30px rgba(0,0,0,.3));
    }
    .portrait-svg { display: block; width: min(100%, 490px); height: auto; }
    .expression-tag {
      position: absolute;
      left: 0;
      bottom: 1rem;
      padding: .45rem .7rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(6,23,25,.76);
      font-size: .7rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
    }
    .dialogue-panel {
      position: absolute;
      z-index: 3;
      left: clamp(1rem, 4vw, 4rem);
      right: clamp(1rem, 4vw, 4rem);
      bottom: clamp(1rem, 3vw, 2.4rem);
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(340px, 1.08fr);
      min-height: 235px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }
    .line-area { position: relative; padding: clamp(1.4rem, 3vw, 2.2rem); border-right: 1px solid var(--line); }
    .speaker {
      display: flex;
      align-items: center;
      gap: .7rem;
      margin-bottom: .85rem;
      color: var(--gold);
      font-size: .72rem;
      font-weight: 850;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .speaker::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .dialogue-text { max-width: 45rem; margin: 0; font: 1.16rem/1.62 Georgia, serif; }
    .selected-line { margin-bottom: .75rem; color: var(--dim); font-size: .78rem; }
    .typing-control { position: absolute; left: 2rem; bottom: 1.1rem; }
    .choices { display: grid; align-content: center; gap: .55rem; padding: 1rem; }

      return String(value ?? "").replace(/[&<>"]/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[char]);
    }
    function currentPatient() { return patientCatalog.find(p => p.id === state.selectedPatientId) || patientCatalog[0]; }
    function meaningfulMeterDelta(raw) {
      if (Math.abs(raw) < 2) return 0;
      return Math.sign(raw) * Math.min(12, Math.max(4, Math.round(Math.abs(raw))));
    }
    function relationshipMeterEffects(effects = {}) {
      const e = effects || {};
      return {
        trust: meaningfulMeterDelta((e.trust || 0) * 6 + (e.disclosure || 0) + (e.repair || 0) * 4 - (e.rupture || 0) * 6 - (e.defensiveness || 0) * 2),
        safety: meaningfulMeterDelta((e.safetyClarity || 0) * 5 + (e.disclosure || 0) * .5 - (e.rupture || 0) * 3 - (e.avoidance || 0) * 2),
        empathy: meaningfulMeterDelta((e.feltValidation || 0) * 5 + (e.trust || 0) - (e.shame || 0) * 3 - (e.defensiveness || 0) * 3 - (e.rupture || 0) * 2),
        collaboration: meaningfulMeterDelta((e.agency || 0) * 4 + (e.treatmentBuyIn || 0) * 4 + (e.repair || 0) * 4 + (e.trust || 0) * .5 - (e.rupture || 0) * 4 - (e.avoidance || 0) * 3)
      };
    }
    function applyRelationshipMeterEffects(levels, changes) {
      const next = { ...levels };
      RELATIONSHIP_VARIABLES.forEach(variable => {
        const current = Number(next[variable.id] ?? 50);
        const change = Number(changes?.[variable.id] || 0);
        if (!change) return;
        const availableSpace = change > 0 ? (100 - current) / 50 : current / 50;
        const boundaryFactor = Math.min(1, Math.max(.35, availableSpace));
        next[variable.id] = Math.max(5, Math.min(100, current + change * boundaryFactor));
      });
      return next;
    }
    function meterEffectsForRecord(record) {
      if (record?.meterEffects && typeof record.meterEffects === "object") return record.meterEffects;
      const storedEffects = record?.effects && typeof record.effects === "object" ? record.effects : null;
      return relationshipMeterEffects(storedEffects || choiceForHistoryRecord(record)?.effects || {});
    }
    function replayRelationshipMeterState(records = []) {
      return records.reduce((levels, record) => applyRelationshipMeterEffects(levels, meterEffectsForRecord(record)), {
        trust: 50,
        safety: 50,
        empathy: 50,
        collaboration: 50
      });
    }
    function roundedRelationshipLevels(levels) {
      return Object.fromEntries(RELATIONSHIP_VARIABLES.map(variable => [variable.id, Math.round(levels[variable.id] ?? 50)]));
    }
    function relationshipLevels(records = state.choiceHistory) {
      return roundedRelationshipLevels(replayRelationshipMeterState(records));
    }
    function renderRelationshipMeters() {
      const levels = relationshipLevels();
      return `<aside class="relationship-meters" aria-label="Patient-provider relationship variables">
        <p class="relationship-title">Relationship variables</p>
        <div class="meter-list">
          ${RELATIONSHIP_VARIABLES.map(variable => {
            const value = levels[variable.id];
            const change = state.lastMeterChanges?.[variable.id] || 0;
            const changeText = change > 0 ? `Rising by ${change}` : change < 0 ? `Falling by ${Math.abs(change)}` : "Steady";
            const visualChange = change > 0 ? `+${change}` : `${change}`;
            const arrow = change > 0 ? "↑" : change < 0 ? "↓" : "";
            return `<div class="meter-item" tabindex="0" aria-label="${variable.label}: ${value} percent full. ${changeText}. ${escapeHtml(variable.description)}">
              <div class="meter-glass" role="meter" aria-label="${variable.label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${value}" style="--meter-color:${variable.color}">

              </div>
              <span class="meter-copy"><span class="meter-name">${variable.label}</span><span class="meter-status">${change ? (change > 0 ? "Rising" : "Falling") : "Steady"}${arrow ? ` <span class="meter-change ${change > 0 ? "up" : "down"}" aria-hidden="true">${arrow} ${visualChange}</span>` : ""}</span></span>
              <span class="meter-tooltip" role="tooltip">${escapeHtml(variable.description)}</span>
            </div>`;
          }).join("")}
        </div>
      </aside>`;
    }
    function getScenes() {
      if (state.currentEncounter === 1) return E1_SCENES;
      if (state.currentEncounter === 2) return e2Scenes(state.firstBranch);

    }
    function choicesInDisplayOrder(scene) {
      const choices = [...(scene.choices || [])];
      const orderKey = `${state.currentEncounter}:${scene.id}`;
      const choicesById = new Map(choices.map(choice => [choice.id, choice]));
      const savedOrder = state.responseOrders?.[orderKey];
      if (Array.isArray(savedOrder) && savedOrder.length === choices.length && new Set(savedOrder).size === choices.length && savedOrder.every(id => choicesById.has(id))) {
        return savedOrder.map(id => choicesById.get(id));
      }

      for (let index = choices.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [choices[index], choices[swapIndex]] = [choices[swapIndex], choices[index]];
      }
      if (choices.length > 1 && choices.every((choice, index) => choice.id === scene.choices[index].id)) {
        const offset = 1 + Math.floor(Math.random() * (choices.length - 1));

    function resolveSceneText(scene) {

    }
    function resolveEncounterOne() {

    }
    function resolveEncounterTwo() {
      const d = state.encounterDelta;
      const collaboration = (d.trust||0) + (d.feltValidation||0) + (d.disclosure||0) + (d.agency||0) + (d.treatmentBuyIn||0) + (d.repair||0) - (d.shame||0) - (d.rupture||0) - (d.defensiveness||0);
      const safetyComplete = !!state.flags.e2_direct_safety_completed;
      const repairComplete = state.firstBranch === "A" || !!state.flags.rupture_repaired || ((d.repair||0) >= 2 && (d.trust||0) >= 3);

    }
    function resolveEncounterThree() {
      const d = state.encounterDelta;
      const sharedClosure = (d.trust||0) + (d.feltValidation||0) + (d.disclosure||0) + (d.agency||0) + (d.treatmentBuyIn||0) + (d.safetyClarity||0) + (d.repair||0) - (d.shame||0) - (d.rupture||0) - (d.defensiveness||0) - (d.avoidance||0);
      const contextHeld = !!state.flags.multifactorial_named;

    function applyChoice(choice, scene) {
      const sceneText = resolveSceneText(scene);
      const levelsBefore = relationshipLevels();

      Object.entries(choice.effects || {}).forEach(([key, value]) => {
        state.dimensions[key] = (state.dimensions[key] || 0) + value;
        state.encounterDelta[key] = (state.encounterDelta[key] || 0) + value;
      });
      (choice.flags || []).forEach(flag => { state.flags[flag] = true; });
      const record = {
        encounter: state.currentEncounter,
        sceneId: scene.id,
        choiceId: choice.id,
        text: choice.text,
        response: choice.response,
        effects: { ...(choice.effects || {}) },
        meterEffects,
        tags: choice.tags,
        rating: choice.rating,
        heard: choice.heard,
        alternative: choice.alternative

      state.choiceHistory.push(record);
      const levelsAfter = relationshipLevels();
      state.lastMeterChanges = Object.fromEntries(RELATIONSHIP_VARIABLES.map(variable => {
        const difference = levelsAfter[variable.id] - levelsBefore[variable.id];
        return [variable.id, difference];
      }));
      state.history.push({ speaker: "Amara", text: sceneText }, { speaker: "You", text: choice.text }, { speaker: "Amara", text: choice.response });

    function advanceScene() {

    function choiceForHistoryRecord(record) {

    function encounterRelationshipTimeline(encounter) {
      let meterState = { trust: 50, safety: 50, empathy: 50, collaboration: 50 };
      const points = [];
      let started = false;
      let step = 0;
      let previousLevels = null;

      state.choiceHistory.forEach(record => {
        if (record.encounter > encounter) return;
        if (record.encounter === encounter && !started) {
          started = true;
          previousLevels = roundedRelationshipLevels(meterState);
          points.push({ step: 0, response: "Encounter start", levels: previousLevels, deltas: {} });
        }

        meterState = applyRelationshipMeterEffects(meterState, meterEffectsForRecord(record));

        if (record.encounter === encounter) {
          step += 1;
          const levels = roundedRelationshipLevels(meterState);
          const deltas = Object.fromEntries(RELATIONSHIP_VARIABLES.map(variable => [variable.id, levels[variable.id] - previousLevels[variable.id]]));
          points.push({ step, response: record.text, levels, deltas });
          previousLevels = levels;
        }
      });

      return { encounter, points };
    }

    function graphMarkerMarkup(variableId, x, y, color, size = 6) {
      if (variableId === "safety") return `<rect class="graph-marker" x="${x - size}" y="${y - size}" width="${size * 2}" height="${size * 2}" rx="1.5" fill="${color}"/>`;
      if (variableId === "empathy") return `<polygon class="graph-marker" points="${x},${y - size - 1} ${x + size + 1},${y} ${x},${y + size + 1} ${x - size - 1},${y}" fill="${color}"/>`;
      if (variableId === "collaboration") return `<polygon class="graph-marker" points="${x},${y - size - 1} ${x + size + 1},${y + size} ${x - size - 1},${y + size}" fill="${color}"/>`;
      return `<circle class="graph-marker" cx="${x}" cy="${y}" r="${size}" fill="${color}"/>`;
    }

    function openRelationshipGraph(encounter) {
      const timeline = encounterRelationshipTimeline(encounter);
      const compactGraph = window.matchMedia("(max-width: 620px)").matches;
      const width = compactGraph ? 320 : 800;
      const height = compactGraph ? 300 : 370;
      const margin = compactGraph
        ? { top: 16, right: 8, bottom: 42, left: 42 }
        : { top: 24, right: 22, bottom: 54, left: 62 };
      const plotWidth = width - margin.left - margin.right;
      const plotHeight = height - margin.top - margin.bottom;
      const finalStep = Math.max(1, timeline.points.length - 1);
      const xFor = step => margin.left + (step / finalStep) * plotWidth;
      const yFor = level => margin.top + ((100 - level) / 100) * plotHeight;
      const yTicks = [100, 75, 50, 25, 0];

      const legend = RELATIONSHIP_VARIABLES.map(variable => `<li class="graph-legend-item">
        <svg class="graph-legend-mark" viewBox="0 0 26 12" aria-hidden="true"><line x1="1" y1="6" x2="25" y2="6" stroke="${variable.color}" stroke-width="3" stroke-linecap="round"/>${graphMarkerMarkup(variable.id, 13, 6, variable.color, 3.5)}</svg>
        <span>${variable.label}</span>
      </li>`).join("");

      const grid = yTicks.map(level => {
        const y = yFor(level);
        return `<line class="graph-grid" x1="${margin.left}" y1="${y}" x2="${width - margin.right}" y2="${y}"/><text class="graph-axis" x="${margin.left - 12}" y="${y + 4}" text-anchor="end">${level}%</text>`;
      }).join("");

      const xLabels = timeline.points.map(point => `<text class="graph-axis" x="${xFor(point.step)}" y="${height - 22}" text-anchor="middle">${point.step === 0 ? "Start" : point.step}</text>`).join("");

      const series = RELATIONSHIP_VARIABLES.map(variable => {
        const coordinates = timeline.points.map(point => `${xFor(point.step)},${yFor(point.levels[variable.id])}`).join(" ");
        const changePoints = timeline.points.filter(point => point.step > 0 && point.deltas[variable.id] !== 0).map(point => {
          const x = xFor(point.step);
          const y = yFor(point.levels[variable.id]);
          const direction = point.deltas[variable.id] > 0 ? "rose" : "fell";
          const label = `${variable.label} ${direction} to ${point.levels[variable.id]} percent after response ${point.step}: ${point.response}`;
          return `<g class="graph-point" tabindex="0" role="button" data-series="${variable.id}" data-step="${point.step}" aria-label="${escapeHtml(label)}">
            <circle class="graph-hit" cx="${x}" cy="${y}" r="11"/>
            <circle class="graph-focus-ring" cx="${x}" cy="${y}" r="11"/>
            ${graphMarkerMarkup(variable.id, x, y, variable.color)}
          </g>`;
        }).join("");
        return `<g aria-label="${variable.label} series"><polyline class="graph-line" points="${coordinates}" stroke="${variable.color}"/>${changePoints}</g>`;
      }).join("");

      modal.classList.add("graph-dialog");
      modalTitle.textContent = `Encounter ${encounter} relationship graph`;
      modalBody.innerHTML = `<section class="relationship-graph">
        <p class="graph-intro">Each line follows one relationship variable through your phrase choices. Hover, focus, or tap a dot to see the exact response that changed it.</p>
        <ul class="graph-legend" aria-label="Graph legend">${legend}</ul>
        <div class="graph-wrap">
          <svg class="relationship-chart" viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="graph-title graph-description">
            <title id="graph-title">Relationship variables during encounter ${encounter}</title>
            <desc id="graph-description">A line graph showing trust, safety, empathy, and collaboration after each response. Interactive markers identify the response associated with each change.</desc>
            ${grid}
            <line class="graph-grid" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${height - margin.bottom}"/>
            ${xLabels}
            <text class="graph-axis-title" x="${margin.left + plotWidth / 2}" y="${height - 4}" text-anchor="middle">Response choice</text>
            <text class="graph-axis-title" transform="translate(16 ${margin.top + plotHeight / 2}) rotate(-90)" text-anchor="middle">Meter level</text>
            ${series}
          </svg>
          <div class="graph-tooltip" id="graph-tooltip" role="tooltip" hidden></div>
        </div>
        <p class="graph-detail" id="graph-detail" aria-live="polite">Hover, focus, or tap a dot to review the phrase connected to that change.</p>
      </section>`;

      const tooltip = document.getElementById("graph-tooltip");
      const detail = document.getElementById("graph-detail");
      const wrap = modalBody.querySelector(".graph-wrap");
      const variablesById = Object.fromEntries(RELATIONSHIP_VARIABLES.map(variable => [variable.id, variable]));

      function showGraphPoint(element) {
        const variable = variablesById[element.dataset.series];
        const point = timeline.points[Number(element.dataset.step)];
        const delta = point.deltas[variable.id];
        const direction = delta > 0 ? "rose" : "fell";
        const copy = `<strong>${variable.label} ${direction} to ${point.levels[variable.id]}%.</strong> Response ${point.step}: “${escapeHtml(point.response)}”`;
        detail.innerHTML = copy;
        tooltip.innerHTML = copy;
        tooltip.hidden = false;

        const markerRect = element.getBoundingClientRect();
        const wrapRect = wrap.getBoundingClientRect();
        const tooltipHalfWidth = Math.min(130, Math.max(70, (wrapRect.width - 16) / 2));
        const markerCenter = markerRect.left + markerRect.width / 2 - wrapRect.left;
        tooltip.style.left = `${Math.max(tooltipHalfWidth, Math.min(wrapRect.width - tooltipHalfWidth, markerCenter))}px`;
        tooltip.style.top = `${markerRect.top - wrapRect.top}px`;
        tooltip.classList.toggle("below", markerRect.top - wrapRect.top < 90);
      }

      function hideGraphTooltip() {
        tooltip.hidden = true;
        tooltip.classList.remove("below");
      }

      modalBody.querySelectorAll(".graph-point").forEach(point => {
        point.addEventListener("mouseenter", () => showGraphPoint(point));
        point.addEventListener("mouseleave", () => { if (document.activeElement !== point) hideGraphTooltip(); });
        point.addEventListener("focus", () => showGraphPoint(point));
        point.addEventListener("blur", hideGraphTooltip);
        point.addEventListener("click", () => showGraphPoint(point));
      });

      modal.showModal();
    }

    function completeCase() {
      if (!ENDINGS[state.endingId]) return;

      const missed = [];
      if (!state.flags.direct_safety_completed) missed.push("Encounter 1 did not include a clear assessment of suicidal thoughts, plan, and intent.");
      if (!state.flags.e2_direct_safety_completed) missed.push("Encounter 2 did not clearly reassess suicidal thoughts, plan, intent, and behavior after a new risk signal.");
      if (state.firstBranch === "B" && !state.flags.rupture_repaired) missed.push("The early rupture was not explicitly acknowledged and repaired.");
      if (!state.flags.support_boundaries_defined && !state.flags.family_trial_consented) missed.push("Family involvement could have been explored with clearer consent and boundaries.");
      if (!state.flags.multifactorial_named) missed.push("The closing formulation did not explicitly hold illness, circumstances, supports, choices, chance, and clinical communication together.");

      app.innerHTML = `
        <section class="screen story-screen" aria-labelledby="debrief-heading">

            <div class="debrief-grid">
              <section class="insight"><h3>Patient outcome</h3><p>${escapeHtml(ending.patientOutcome)}</p></section>
              <section class="insight"><h3>Therapeutic relationship</h3><p>${escapeHtml(ending.relationship)}</p></section>
              <section class="insight"><h3>Major consequence</h3><p>${escapeHtml(ending.consequence)}</p></section>
              <section class="insight" style="--accent:var(--gold)"><h3>Teaching pearl</h3><p>${escapeHtml(ending.pearl)}</p></section>
              <section class="insight"><h3>Statements that helped</h3>${quoteList(helped, "No strongly opening statements were recorded on this path.")}</section>
              <section class="insight" style="--accent:var(--rose)"><h3>Statements that limited the encounter</h3>${quoteList(limited, "This path contained no strongly limiting statements; review the alternatives for further refinement.")}</section>
              <section class="insight" style="grid-column:1/-1"><h3>Missed or incomplete opportunities</h3>${missed.length ? `<ul>${missed.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : `<p>Direct safety assessment, collaborative support planning, and major repair opportunities were addressed. Clinical completeness would still require a full assessment beyond this compressed simulation.</p>`}</section>
            </div>
            <div class="ethics-note"><strong>Outcome framing:</strong> Psychiatric outcomes are influenced by many factors. This simulation compresses a complex clinical course to examine one modifiable factor: clinician communication. No single phrase independently causes recovery, relapse, self-harm, hospitalization, or treatment discontinuation.</div>
            <div class="button-row"><button class="primary" id="view-map">View branch map</button><button class="secondary" id="replay-case">Replay case</button><button class="quiet-button" id="debrief-cases">Patient selection</button></div>
          </article>
        </section>`;
      document.getElementById("view-map").addEventListener("click", () => { state.view = "branchMap"; saveState(); render(); });
      document.getElementById("replay-case").addEventListener("click", restartCase);
      document.getElementById("debrief-cases").addEventListener("click", () => { state.view = "select"; state.resumeView = null; saveState(); render(); });
      announce(`Case complete. Ending: ${ending.title}`);

    function quoteList(records, fallback) {
      return records.length ? `<ul>${records.map(item => `<li class="quote">“${escapeHtml(item.text)}”</li>`).join("")}</ul>` : `<p>${escapeHtml(fallback)}</p>`;
    }
    function renderBranchMap() {
      const encounterOneLabels = { A: "Felt able to disclose", B: "Withheld concerns" };
      const encounterTwoLabels = {
        AA: "Collaboration sustained",
        AB: "Later rupture",

        BB: "Disengagement compounded"
      };

        AAA: "Agency and continuity centered",
        AAB: "Closure narrowed shared authorship",
        ABA: "A bridge back was made explicit",

        BAB: "Repair was not consolidated",
        BBA: "Transfer honored as agency",
        BBB: "Transition remained difficult to approach"
      };
      const pathIsVisible = id => endingsSeen.includes(id) || state.endingId === id;
      const branchIsVisible = prefix => Object.keys(ENDINGS).some(id => id.startsWith(prefix) && pathIsVisible(id));
      const renderEncounterThreeBranch = id => {
        const visible = pathIsVisible(id);
        const current = state.endingId === id;
        const status = current ? "Your current path" : visible ? "Previously discovered" : "Replay to reveal";
        return `<li aria-label="Ending ${id}, ${visible ? "discovered" : "not yet discovered"}">

      app.innerHTML = `

            <div class="button-row"><button class="primary" id="map-replay">Replay from week one</button><button class="secondary" id="map-debrief">Return to debrief</button><button class="quiet-button" id="educator-toggle">Show educator lens</button></div>

      const branchMapScroller = document.querySelector(".decision-tree-wrap");
      if (branchMapScroller) branchMapScroller.scrollLeft = Math.max(0, (branchMapScroller.scrollWidth - branchMapScroller.clientWidth) / 2);

    document.getElementById("modal-close").addEventListener("click", () => modal.close());

      }
    });

    applySettings();
    render();
  })();
  </script>
