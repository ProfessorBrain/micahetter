<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask a Question</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { color: #222; background: #fff; font: 16px Arial, sans-serif; }
    main { width: min(100% - 32px, 720px); margin: clamp(24px, 7vh, 64px) auto; }
    iframe { display: block; width: 100%; height: 460px; border: 0; overflow: hidden; }
    @media (max-width: 480px) { iframe { height: 520px; } }
  </style>
</head>
<body>
  <main>
    <iframe
      id="askFrame"
      title="Ask a Question"
      src="https://script.google.com/macros/s/AKfycbwsp-6ucv2wg8Tfl3rxS-lQl9CzI8Xx1VG3t0CzBHdH599GQdQ6LTwqUulIQhSxYu_L/exec?v=5"
      referrerpolicy="strict-origin-when-cross-origin"
      scrolling="no"
      loading="eager"></iframe>
  </main>
  <script>
    const frame = document.getElementById('askFrame');
    function belongsToForm(source) {
      try {
        for (let depth = 0; source && depth < 8; depth += 1) {
          if (source === frame.contentWindow) return true;
          const parent = source.parent;
          if (parent === source) break;
          source = parent;
        }
      } catch (_) {}
      return false;
    }
    window.addEventListener('message', function (event) {
      let origin;
      try { origin = new URL(event.origin); } catch (_) { return; }
      const googleHost = origin.hostname === 'script.googleusercontent.com' || origin.hostname.endsWith('-script.googleusercontent.com');
      if (origin.protocol !== 'https:' || !googleHost || !belongsToForm(event.source)) return;
      const message = event.data;
      if (!message || message.type !== 'ask-form-height' || !Number.isFinite(message.height) || message.height <= 0) return;
      // Reserve space for Google's surrounding app banner, including on mobile.
      const height = Math.min(250000, Math.max(320, Math.ceil(message.height) + 96));
      if (frame.style.height !== height + 'px') frame.style.height = height + 'px';
    });
  </script>
</body>
</html>
