<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="ask-form-version" content="3.0">
  <title>Ask a Question</title>
  <link rel="icon" href="data:,">
  <style>
    body { font: 16px Arial, sans-serif; max-width: 520px; margin: 80px auto; padding: 0 20px; }
    form { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; min-width: 0; padding: 12px; font: inherit; border: 1px solid #aaa; border-radius: 6px; }
    button { padding: 12px 18px; font: inherit; background: #222; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    #status { min-height: 1.5em; margin-top: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <!-- Ordinary form POSTs work across origins. A hidden frame prevents navigation. -->
  <form id="askForm"
        action="https://script.google.com/macros/s/AKfycbwsp-6ucv2wg8Tfl3rxS-lQl9CzI8Xx1VG3t0CzBHdH599GQdQ6LTwqUulIQhSxYu_L/exec"
        method="POST"
        target="askResponseFrame"
        accept-charset="UTF-8">
    <input id="question" name="text" type="text" maxlength="3000" required
           autocomplete="off" aria-label="Question or comment"
           placeholder="Enter text...">
    <input id="submissionId" name="submissionId" type="hidden">
    <button id="submitButton" type="submit">Submit</button>
  </form>
  <iframe name="askResponseFrame" title="Submission response" hidden tabindex="-1"></iframe>
  <p id="status" role="status" aria-live="polite"></p>

  <script>
    'use strict';
    console.info('Ask form v3.0 loaded (native form POST)');

    const form = document.getElementById('askForm');
    const question = document.getElementById('question');
    const submissionIdInput = document.getElementById('submissionId');
    const button = document.getElementById('submitButton');
    const status = document.getElementById('status');
    const endpoint = form.action;
    const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
    let sending = false;

    // Read-only JSONP receipt check: the backend never returns the submitted text.
    function checkReceipt(submissionId) {
      return new Promise(resolve => {
        const callback = '_askCheck_' + submissionId.replace(/-/g, '');
        const tag = document.createElement('script');
        let completed = false;
        let timeout;

        const complete = result => {
          if (completed) return;
          completed = true;
          clearTimeout(timeout);
          tag.remove();
          delete window[callback];
          resolve(result); // true = saved, false = not yet found, null = unavailable
        };

        window[callback] = result => complete(result && result.saved === true);
        tag.onerror = () => complete(null);
        tag.onload = () => complete(null); // The callback runs first if valid JS was served.
        timeout = setTimeout(() => complete(null), 5000);

        const url = new URL(endpoint);
        url.searchParams.set('action', 'status');
        url.searchParams.set('submissionId', submissionId);
        url.searchParams.set('callback', callback);
        url.searchParams.set('_', String(Date.now()));
        tag.src = url.toString();
        document.head.appendChild(tag);
      });
    }

    async function verifySubmission(submissionId) {
      await wait(950); // Give doPost a moment to write and cache the receipt.
      for (let attempt = 0; attempt < 5; attempt++) {
        const saved = await checkReceipt(submissionId);
        if (saved === true) return true;
        if (saved === null) return null;
        await wait(1250);
      }
      return false;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (sending) return;

      const text = question.value.trim();
      if (!text) return;
      sending = true;
      question.value = text;
      submissionIdInput.value = crypto.randomUUID();
      question.readOnly = true; // Read-only fields are included in HTML form POSTs.
      button.disabled = true;
      status.textContent = 'Submitting...';

      try {
        // Not fetch(): this is a native browser POST directed at the hidden iframe.
        // It works without CORS and lets Apps Script read e.parameter.text.
        HTMLFormElement.prototype.submit.call(form);
        console.info('Ask form native POST dispatched. Submission ID:', submissionIdInput.value);

        const result = await verifySubmission(submissionIdInput.value);
        if (result === true) {
          question.value = '';
          status.textContent = 'Submitted successfully.';
        } else {
          status.textContent = 'Submission could not be confirmed. Please check the spreadsheet before submitting the same question again.';
          console.warn('Ask form: no confirmed receipt. In Apps Script, check Executions for doPost errors.');
        }
      } catch (error) {
        console.error('Ask form error:', error);
        status.textContent = 'Could not submit. Please try again later.';
      } finally {
        question.readOnly = false;
        button.disabled = false;
        sending = false;
        question.focus();
      }
    });
  </script>
</body>
</html>
