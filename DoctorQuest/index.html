        scratchContext.arc(point.x, point.y, brushRadius, 0, Math.PI * 2);
        scratchContext.fill();
        scratchContext.restore();

        let sampleChanged = false;
        quadrants.forEach(quadrant => {
          if (quadrant.complete) return;
          quadrant.samples.forEach(sample => {
            if (sample.revealed) return;
            if (Math.hypot(sample.x - point.x, sample.y - point.y) <= brushRadius) {

        };

        if (cell.stage >= sharedNodes.length - 1) return routePoint(cell, sharedNodes.length - 1);

        const angle = Math.atan2(end.y - start.y, end.x - start.x);

        context.translate(x, y);
        context.rotate(angle);
        context.fillStyle = color;
        context.beginPath();
        context.moveTo(13, 0);
        context.lineTo(-8, -9);

        const y = start.y + ((end.y - start.y) * valve.at);
        const angle = Math.atan2(end.y - start.y, end.x - start.x);
        const open = valveIsOpen(valve, phaseName);
        context.save();
        context.translate(x, y);
        context.rotate(angle);
        context.strokeStyle = open ? "#7dda91" : "#ffcf5c";
        context.lineWidth = 7;
        context.lineCap = "square";
        context.beginPath();
        if (open) {
          context.moveTo(-9, -16);
          context.lineTo(9, -7);
          context.moveTo(-9, 16);
          context.lineTo(9, 7);
        } else {
          context.moveTo(0, -20);
          context.lineTo(0, -2);
          context.moveTo(0, 2);
          context.lineTo(0, 20);
        }
        context.stroke();
        context.restore();

        const normalX = -Math.sin(angle);
        const normalY = Math.cos(angle);
        const labelX = x + (normalX * 30);
        const labelY = y + (normalY * 30);
        context.fillStyle = open ? "#285f39" : "#6b3137";

      function pointerCoordinates(event) {
        const bounds = canvas.getBoundingClientRect();
        return {
          x: ((event.clientX - bounds.left) / bounds.width) * canvasWidth,
          y: ((event.clientY - bounds.top) / bounds.height) * canvasHeight
        };
      }

      function projectOntoSegment(point, start, end) {
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const lengthSquared = (dx * dx) + (dy * dy);
        const raw = lengthSquared
          ? (((point.x - start.x) * dx) + ((point.y - start.y) * dy)) / lengthSquared
          : 0;
        const progress = clamp(raw, 0, 1);
        const projectedX = start.x + (dx * progress);
        const projectedY = start.y + (dy * progress);
        return {
          progress,
          distance: Math.hypot(point.x - projectedX, point.y - projectedY)
        };
      }

      function describeCellLocation(cell) {
        if (cell.stage === 0) return cell.originName;
        return sharedNodes[Math.min(cell.stage, sharedNodes.length - 1)].label;
      }

      function updateDraggedCell(timestamp) {
        if (!dragging || dragging.cell.done) return;
        const cell = dragging.cell;
        const start = routePoint(cell, cell.stage);
        const end = routePoint(cell, cell.stage + 1);
        const projection = projectOntoSegment(dragging.pointer, start, end);
        if (projection.distance > pathTolerance) {
          setCardiacStatus("Keep the red cell over the highlighted circulation path.", "blocked");
          return;
        }

        const wantedProgress = Math.max(cell.progress, projection.progress);
        const valve = valves[cell.stage];
        const phase = cycleStateAt(timestamp);
        if (valve && !cell.passedGate) {
          const gateOpen = valveIsOpen(valve, phase.name);
          if (!gateOpen) {
            const stoppingPoint = valve.at - 0.09;
            cell.progress = Math.max(cell.progress, Math.min(wantedProgress, stoppingPoint));
            if (projection.progress >= stoppingPoint) {
              setCardiacStatus(
                valve.label + " valve is closed during " + phase.name + ". Hold the cell here until " + valve.opensDuring + ".",
                "blocked"
              );
            }
            return;
          }
          if (wantedProgress >= valve.at) {
            cell.passedGate = true;
            setCardiacStatus(cell.number + " passed the " + valve.label.toLowerCase() + " valve during " + phase.name + ".");
            playSfx("click");
          }
        }

        cell.progress = wantedProgress;
        if (cell.progress < 0.93) return;

        cell.stage += 1;
        cell.progress = 0;
        cell.passedGate = false;
        if (cell.stage >= sharedNodes.length - 1) {
          cell.stage = sharedNodes.length - 1;
          cell.done = true;
          const deliveredPointerId = dragging.pointerId;
          dragging = null;
          stage.classList.remove("dragging");
          if (canvas.hasPointerCapture(deliveredPointerId)) canvas.releasePointerCapture(deliveredPointerId);
          renderCardiacProgress();
          playSfx("success");
          const delivered = cells.filter(item => item.done).length;
          if (delivered === cells.length) {
            finishCardiacGame();
          } else {
            setCardiacStatus("Cell " + cell.number + " reached the aorta. Select another red cell.", "success");
          }
          return;
        }

        const arrival = sharedNodes[cell.stage].label;
        if (cell.stage === 3) {
          setCardiacStatus("Cell " + cell.number + " reached the lungs and is now oxygenated. Continue toward the left atrium.", "success");
        } else {
          setCardiacStatus("Cell " + cell.number + " reached the " + arrival + ". Continue in the direction of the arrows.");
        }
      }

      function beginCardiacDrag(event) {
        if (finished || event.button !== 0) return;
        const point = pointerCoordinates(event);
        const cell = cells
          .filter(item => !item.done)
          .map(item => ({ item, distance: Math.hypot(point.x - cellPosition(item).x, point.y - cellPosition(item).y) }))
          .sort((a, b) => a.distance - b.distance)[0];
        if (!cell || cell.distance > 28) {
          setCardiacStatus("Select one of the numbered red cells before tracing the circulation path.", "blocked");
          return;
        }

        event.preventDefault();
        dragging = {
          cell: cell.item,
          pointerId: event.pointerId,
          pointer: point
        };
        stage.classList.add("dragging");
        canvas.setPointerCapture(event.pointerId);
        setCardiacStatus(
          "Cell " + cell.item.number + " selected at the " + describeCellLocation(cell.item) + ". Drag forward with the arrows."
        );
      }

      function moveCardiacDrag(event) {
        if (!dragging || event.pointerId !== dragging.pointerId) return;
        event.preventDefault();
        dragging.pointer = pointerCoordinates(event);
      }

      function endCardiacDrag(event) {
        if (!dragging || event.pointerId !== dragging.pointerId) return;
        event.preventDefault();
        const cell = dragging.cell;
        dragging = null;
        stage.classList.remove("dragging");
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        if (!cell.done && !finished) {
          setCardiacStatus(
            "Cell " + cell.number + " is at the " + describeCellLocation(cell) + ". Drag it forward again when ready."
          );
        }
      }

      function cancelCardiacDrag(event) {
        if (!dragging || event.pointerId !== dragging.pointerId) return;
        dragging = null;
        stage.classList.remove("dragging");
        if (!finished) setCardiacStatus("Drag interrupted. Select a red cell to continue.", "blocked");
      }

      function finishCardiacGame() {
        if (finished) return;
        finished = true;
        const activePointerId = dragging ? dragging.pointerId : null;
        cells.forEach(cell => {
          cell.stage = sharedNodes.length - 1;
          cell.progress = 0;
          cell.passedGate = true;
          cell.done = true;
        });
        dragging = null;
        stage.classList.remove("dragging");
        if (activePointerId !== null && canvas.hasPointerCapture(activePointerId)) {
          canvas.releasePointerCapture(activePointerId);
        }
        renderCardiacProgress();
        drawHeartScene(performance.now());
        setMinigameAutowin(null);
        if (state.cardiacFrame) {
          cancelAnimationFrame(state.cardiacFrame);
          state.cardiacFrame = null;
        }
        setCardiacStatus("All three cells completed one-way circulation. The rhythm is regular at 80 beats per minute.", "success");
        playSfx("success");

        setTimeout(() => {
          if (!document.getElementById("cardiacGame")) return;

            return;

          );

      function cardiacTick(frameTime) {
        if (finished || !document.getElementById("cardiacGame")) return;
        const cycle = cycleStateAt(frameTime);
        if (cycle.cycleIndex !== lastDiastoleSoundCycle) {
          lastDiastoleSoundCycle = cycle.cycleIndex;
          playHeartSound("s2");
        }
        if (cycle.phase >= diastoleFraction && cycle.cycleIndex !== lastSystoleSoundCycle) {
          lastSystoleSoundCycle = cycle.cycleIndex;
          playHeartSound("s1");
        }
        if (cycle.name !== lastRenderedPhase) {
          lastRenderedPhase = cycle.name;
          phaseLabel.textContent = cycle.name === "diastole" ? "Diastole: ventricular filling" : "Systole: ventricular ejection";
          valveSummary.textContent = cycle.name === "diastole"
            ? "Tricuspid + mitral open"
            : "Pulmonic + aortic open";
        }
        beatLamp.classList.toggle("beat", cycle.phase >= diastoleFraction && cycle.phase < diastoleFraction + 0.14);
        if (dragging) updateDraggedCell(frameTime);
        drawHeartScene(frameTime);
        if (!finished) state.cardiacFrame = requestAnimationFrame(cardiacTick);
      }

      canvas.addEventListener("pointerdown", beginCardiacDrag);
      canvas.addEventListener("pointermove", moveCardiacDrag);
      canvas.addEventListener("pointerup", endCardiacDrag);
      canvas.addEventListener("pointercancel", cancelCardiacDrag);
      canvas.addEventListener("lostpointercapture", cancelCardiacDrag);
      renderCardiacProgress();
      setMinigameAutowin(finishCardiacGame);
      state.cardiacFrame = requestAnimationFrame(cardiacTick);
      canvas.focus({ preventScroll: true });
    }

    function openLungAuscultationGame() {

      function cycleStateAt(timestamp) {
        const elapsed = Math.max(0, timestamp - cycleOrigin);
        const cycleIndex = Math.floor(elapsed / cycleDuration);
        const phase = (elapsed % cycleDuration) / cycleDuration;
        const cycleStart = cycleOrigin + (cycleIndex * cycleDuration);
        return { phase, cycleStart };
      }

      function renderLungProgress() {
        progressText.textContent = "Fields heard " + completedFields.size + " / " + fieldOrder.length;

      function stopBreathSound() {
        if (!state.lungBreathSource) return;
        try { state.lungBreathSource.stop(); } catch (error) {}
        state.lungBreathSource = null;
      }

      function scheduleBreathSound(fieldId) {
        const audioContext = musicState.context;
        if (!audioContext || !musicState.sfxMaster || !holding || holding.fieldId !== fieldId || finished) return;
        const seconds = cycleDuration / 1000;
        const sampleCount = Math.ceil(audioContext.sampleRate * seconds);
        if (!breathBuffer || breathBuffer.sampleRate !== audioContext.sampleRate) {
          breathBuffer = audioContext.createBuffer(1, sampleCount, audioContext.sampleRate);
          const samples = breathBuffer.getChannelData(0);
          let smoothedNoise = 0;
          for (let index = 0; index < samples.length; index += 1) {
            smoothedNoise = (smoothedNoise * 0.72) + (((Math.random() * 2) - 1) * 0.28);
            samples[index] = smoothedNoise;
          }
        }

        stopBreathSound();
        const source = audioContext.createBufferSource();
        const filter = audioContext.createBiquadFilter();
        const gain = audioContext.createGain();
        const now = audioContext.currentTime;
        const inspirationEnd = now + (seconds * inspirationFraction);
        const end = now + seconds;
        source.buffer = breathBuffer;
        filter.type = "bandpass";
        filter.frequency.value = 650;
        filter.Q.value = 0.55;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.15, now + (seconds * 0.24));
        gain.gain.linearRampToValueAtTime(0.045, inspirationEnd);
        gain.gain.linearRampToValueAtTime(0.085, inspirationEnd + (seconds * 0.22));
        gain.gain.exponentialRampToValueAtTime(0.0001, end);
        source.connect(filter);
        filter.connect(gain);
        gain.connect(musicState.sfxMaster);
        source.start(now);
        source.stop(end + 0.03);
        state.lungBreathSource = source;
        source.onended = () => {
          if (state.lungBreathSource === source) state.lungBreathSource = null;
        };
      }

      function startBreathSound(fieldId) {
        if (!ensureAudioContext() || state.sfxVolume <= 0) return;
        const audioContext = musicState.context;
        if (audioContext.state === "suspended") {
          audioContext.resume().then(() => scheduleBreathSound(fieldId)).catch(() => {});
          return;
        }
        scheduleBreathSound(fieldId);
      }

      function clearHoldVisuals(attempt) {
        const button = fieldButtons.find(item => item.dataset.lungField === attempt.fieldId);
        if (button) button.classList.remove("holding");
        holdRing.classList.remove("active", "late");
        stopBreathSound();
      }

      function finishLungGame() {
        if (finished) return;
        finished = true;
        if (holding) {
          const attempt = holding;
          holding = null;
          const heldButton = fieldButtons.find(button => button.dataset.lungField === attempt.fieldId);
          if (heldButton && heldButton.hasPointerCapture(attempt.pointerId)) heldButton.releasePointerCapture(attempt.pointerId);
          clearHoldVisuals(attempt);
        }
        fieldOrder.forEach(field => completedFields.add(field.id));
        renderLungProgress();
        setMinigameAutowin(null);
        if (state.lungFrame) {
          cancelAnimationFrame(state.lungFrame);
          state.lungFrame = null;
        }
        setLungStatus("All four posterior fields are clear and symmetric through complete respiratory cycles.", "success");
        playSfx("success");

        setTimeout(() => {
          if (!document.getElementById("lungGame")) return;
          const recorded = recordPhysicalExamAction("pulmonary", "lungAuscultation");
          if (!recorded) {
            closeModal();
            return;
          }
          reportPhysicalExamMinigame(
            "pulmonary",
            recorded.action.result + (recorded.systemComplete ? " " + recorded.system.label + " examination complete." : "")
          );
        }, 900);
      }

      function beginLungHold(event) {
        if (finished || holding || event.button !== 0) return;
        const fieldId = event.currentTarget.dataset.lungField;
        const field = fieldOrder.find(item => item.id === fieldId);
        if (!field || completedFields.has(fieldId)) return;

        const now = performance.now();
        const cycle = cycleStateAt(now);
        if (cycle.phase > startTolerance) {
          setLungStatus("Wait for the cursor circle to finish contracting and begin expanding, then press and hold.", "miss");
          return;
        }

        event.preventDefault();
        const bounds = stage.getBoundingClientRect();
        holding = {
          fieldId,
          pointerId: event.pointerId,
          targetTime: cycle.cycleStart + cycleDuration
        };
        event.currentTarget.classList.add("holding");
        event.currentTarget.setPointerCapture(event.pointerId);
        holdRing.style.left = (event.clientX - bounds.left) + "px";
        holdRing.style.top = (event.clientY - bounds.top) + "px";
        holdRing.classList.add("visible", "active");
        setLungStatus("Listening at the " + field.label + ". Hold while the circle expands and contracts.");
        startBreathSound(fieldId);
      }

      function endLungHold(event) {
        if (!holding || event.pointerId !== holding.pointerId) return;
        event.preventDefault();
        const attempt = holding;
        holding = null;
        if (event.currentTarget.hasPointerCapture(event.pointerId)) event.currentTarget.releasePointerCapture(event.pointerId);
        clearHoldVisuals(attempt);

        const timingError = performance.now() - attempt.targetTime;
        if (Math.abs(timingError) <= releaseTolerance) {
          const completed = fieldOrder.find(field => field.id === attempt.fieldId);
          completedFields.add(attempt.fieldId);
          renderLungProgress();
          playSfx("success");
          if (completedFields.size === fieldOrder.length) {
            finishLungGame();
            return;
          }
          setLungStatus("Complete cycle heard at the " + completed.label + ". Choose any remaining field.", "success");
          return;
        }

        renderLungProgress();
        if (timingError < 0) {
          const phase = cycleStateAt(performance.now()).phase;
          const phaseName = phase < inspirationFraction ? "expansion" : "contraction";
          setLungStatus("Released during " + phaseName + ". Keep listening until the circle returns to its smallest size.", "miss");
        } else {
          setLungStatus("Held too long. Release as the cursor circle finishes contracting.", "miss");
        }
      }

      function cancelLungHold(event) {
        if (!holding || event.pointerId !== holding.pointerId) return;
        const attempt = holding;
        holding = null;
        clearHoldVisuals(attempt);
        renderLungProgress();
        setLungStatus("Listening interrupted. Try again when the cursor circle begins expanding.", "miss");
      }

      function positionLungRing(event) {
        const bounds = stage.getBoundingClientRect();
        const x = Math.max(0, Math.min(bounds.width, event.clientX - bounds.left));
        const y = Math.max(0, Math.min(bounds.height, event.clientY - bounds.top));
        holdRing.style.left = x + "px";
        holdRing.style.top = y + "px";
        holdRing.classList.add("visible");
      }

      function lungTick(frameTime) {
        if (finished || !document.getElementById("lungGame")) return;
        const cycle = cycleStateAt(frameTime);
        const inspiring = cycle.phase < inspirationFraction;
        const expansion = inspiring
          ? cycle.phase / inspirationFraction
          : 1 - ((cycle.phase - inspirationFraction) / (1 - inspirationFraction));
        const ringSize = 40 + (Math.max(0, Math.min(1, expansion)) * 76);
        holdRing.style.width = ringSize.toFixed(1) + "px";
        holdRing.style.height = ringSize.toFixed(1) + "px";

        if (holding) {
          const remaining = holding.targetTime - frameTime;
          holdRing.classList.toggle("late", remaining < -releaseTolerance);
        }

        state.lungFrame = requestAnimationFrame(lungTick);
      }

      drawPatientBack();
      stage.addEventListener("pointerenter", positionLungRing);
      stage.addEventListener("pointermove", positionLungRing);
      stage.addEventListener("pointerleave", () => {
        if (!holding) holdRing.classList.remove("visible");
      });
      fieldButtons.forEach(button => {
        button.addEventListener("pointerdown", beginLungHold);
        button.addEventListener("pointerup", endLungHold);
        button.addEventListener("pointercancel", cancelLungHold);
        button.addEventListener("lostpointercapture", cancelLungHold);
      });
      setMinigameAutowin(finishLungGame);
      renderLungProgress();
      state.lungFrame = requestAnimationFrame(lungTick);
      const firstField = fieldButtons.find(button => button.dataset.lungField === fieldOrder[0].id);
      if (firstField) firstField.focus({ preventScroll: true });
    }

    function openPupilInspectionGame() {
      const canvasWidth = 900;
      const canvasHeight = 600;
      const targetMinimum = 0.36;
      const targetMaximum = 0.60;
      const stableGoal = 5;
      const dilationRate = 0.15;
      const constrictRate = 0.27;
      let pupilSize = 0.75;
      const eyeCenters = { right: { x: 260, y: 338 }, left: { x: 637, y: 338 } };
      let shining = false;
      let litEye = "right";
      let pointerId = null;
      let pointer = { x: 450, y: 510 };
      let stableTime = 0;
      let lastFrameTime = null;
      let finished = false;

      openModal(`
        <section class="modal-card pupil-card" id="pupilGame" role="dialog" aria-modal="true" aria-labelledby="pupilTitle">
          <div class="modal-header"><h2 id="pupilTitle">Pupil and Eye Inspection</h2><button type="button" data-close aria-label="Close">X</button></div>
          <p>Press and hold over either eye to shine the light. Pulse and alternate the light until both pupil edges remain inside the green bands.</p>
          <div class="pupil-hud" aria-live="polite">
            <div class="pupil-progress" aria-hidden="true"><span class="pupil-progress-fill" id="pupilProgressFill"></span></div>
            <span class="pupil-progress-text" id="pupilProgressText">Stable 0.0 / 5.0 s</span>
          </div>
          <div class="pupil-stage" id="pupilStage">
            <img src="assets/pupil-exam.png" alt="Close-up of the patient's eyes">
            <canvas id="pupilCanvas" width="900" height="600" tabindex="0" aria-describedby="pupilStatus" aria-label="Two-eye pupillary light response game"></canvas>
          </div>
          <p class="pupil-status" id="pupilStatus" aria-live="polite">Light off: both pupils are dilating.</p>
        </section>
      `);

      document.querySelector(".game-root").classList.add("pupil-testing");
      const canvas = document.getElementById("pupilCanvas");
      const context = canvas.getContext("2d");
      const progressFill = document.getElementById("pupilProgressFill");
      const progressText = document.getElementById("pupilProgressText");
      const status = document.getElementById("pupilStatus");

      function clamp(value, minimum, maximum) {
        return Math.max(minimum, Math.min(maximum, value));
      }

      function pupilInZone(value) {
        return value >= targetMinimum && value <= targetMaximum;
      }

      function pupilRadius(value) {
        return 8 + (value * 32);
      }

      function drawPixelPupil(center, radius) {
        const pixelSize = 4;
        const snappedRadius = Math.max(pixelSize, Math.round(radius / pixelSize) * pixelSize);
        const cellRadius = Math.ceil(snappedRadius / pixelSize);
        context.fillStyle = "#10131b";

        for (let row = -cellRadius; row <= cellRadius; row += 1) {
          for (let column = -cellRadius; column <= cellRadius; column += 1) {
            const offsetX = column * pixelSize;
            const offsetY = row * pixelSize;
            if ((offsetX * offsetX) + (offsetY * offsetY) > snappedRadius * snappedRadius) continue;
            context.fillRect(center.x + offsetX - (pixelSize / 2), center.y + offsetY - (pixelSize / 2), pixelSize, pixelSize);
          }
        }
      }

      function pointerPosition(event) {
        const bounds = canvas.getBoundingClientRect();
        return {
          x: clamp(((event.clientX - bounds.left) / bounds.width) * canvasWidth, 0, canvasWidth),
          y: clamp(((event.clientY - bounds.top) / bounds.height) * canvasHeight, 0, canvasHeight)
        };
      }

      function drawLightBeam() {
        if (!shining) return;
        const center = eyeCenters[litEye];
        const gradient = context.createRadialGradient(center.x, center.y, 10, center.x, center.y, 150);
        gradient.addColorStop(0, "rgba(255,247,184,0.52)");
        gradient.addColorStop(1, "rgba(255,222,97,0)");
        context.fillStyle = gradient;
        context.beginPath();
        context.arc(center.x, center.y, 150, 0, Math.PI * 2);
        context.fill();

        context.fillStyle = "rgba(255,233,137,0.22)";
        context.beginPath();
        context.moveTo(pointer.x, pointer.y);
        context.lineTo(center.x - 76, center.y - 42);
        context.lineTo(center.x + 76, center.y + 42);
        context.closePath();
        context.fill();
      }

      function drawEye(side, label) {
        const center = eyeCenters[side];
        const value = pupilSize;
        const inZone = pupilInZone(value);
        const isDirect = shining && litEye === side;
        const isConsensual = shining && litEye !== side;

        context.save();
        const lowerRadius = pupilRadius(targetMinimum);
        const upperRadius = pupilRadius(targetMaximum);
        const targetRadius = (lowerRadius + upperRadius) / 2;
        const targetWidth = upperRadius - lowerRadius;
        context.strokeStyle = "rgba(20,48,28,0.92)";
        context.lineWidth = targetWidth + 5;
        context.beginPath();
        context.arc(center.x, center.y, targetRadius, 0, Math.PI * 2);
        context.stroke();
        context.strokeStyle = inZone ? "rgba(143,255,146,0.96)" : "rgba(105,232,111,0.82)";
        context.lineWidth = targetWidth;
        context.beginPath();
        context.arc(center.x, center.y, targetRadius, 0, Math.PI * 2);
        context.stroke();

        drawPixelPupil(center, pupilRadius(value));

        context.setLineDash([5, 4]);
        context.strokeStyle = "rgba(171,255,173,0.94)";
        context.lineWidth = 2;
        context.beginPath();
        context.arc(center.x, center.y, lowerRadius, 0, Math.PI * 2);
        context.stroke();
        context.beginPath();
        context.arc(center.x, center.y, upperRadius, 0, Math.PI * 2);
        context.stroke();
        context.setLineDash([]);

        context.fillStyle = "rgba(255,255,255,0.88)";
        context.fillRect(center.x - 10, center.y - 13, 6, 6);

        const responseLabel = isDirect ? "DIRECT" : isConsensual ? "CONSENSUAL" : "";
        if (responseLabel) {
          context.fillStyle = "rgba(33,25,35,0.8)";
          context.fillRect(center.x - 75, 425, 150, 29);
          context.font = "bold 14px 'Courier New', monospace";
          context.textAlign = "center";
          context.fillStyle = isDirect ? "#ffe175" : "#b8e0d2";
          context.fillText(label + ": " + responseLabel, center.x, 445);
        }
        context.restore();
      }

      function drawFlashlight() {
        context.save();
        context.font = "34px 'Segoe UI Emoji', sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.shadowColor = "rgba(0,0,0,0.65)";
        context.shadowOffsetX = 3;
        context.shadowOffsetY = 3;
        context.fillText("\u{1F526}", pointer.x, pointer.y);
        context.restore();
      }

      function drawGame() {
        context.clearRect(0, 0, canvasWidth, canvasHeight);
        drawLightBeam();
        drawEye("right", "RIGHT EYE");
        drawEye("left", "LEFT EYE");
        drawFlashlight();
      }

      function updateHud() {
        const progress = Math.min(1, stableTime / stableGoal);
        progressFill.style.width = (progress * 100) + "%";
        progressText.textContent = "Stable " + stableTime.toFixed(1) + " / " + stableGoal.toFixed(1) + " s";

        const bothInZone = pupilInZone(pupilSize);
        status.className = "pupil-status" + (bothInZone ? " in-zone" : "");
        if (bothInZone) {
          status.textContent = "Both pupils are in the green zone. Keep the response stable.";
        } else if (shining) {
          status.textContent = "Light on the " + litEye + " eye: both pupils constrict together, directly here and consensually in the other eye.";
        } else {
          status.textContent = "Light off: both pupils are dilating.";
        }
      }

      function stopPupilAnimation() {
        if (state.pupilFrame) {
          cancelAnimationFrame(state.pupilFrame);
          state.pupilFrame = null;
        }
      }

      function finishPupilGame() {
        if (finished) return;
        finished = true;
        shining = false;
        stableTime = stableGoal;
        setMinigameAutowin(null);
        stopPupilAnimation();
        progressFill.style.width = "100%";
        progressText.textContent = "Stable 5.0 / 5.0 s";
        status.className = "pupil-status success";
        status.textContent = "Both pupils constrict directly and consensually, then redilate symmetrically.";
        drawGame();
        playSfx("success");

        setTimeout(() => {
          if (!document.getElementById("pupilGame")) return;
          const recorded = recordPhysicalExamAction("heent", "pupils");
          if (!recorded) {
            closeModal();
            return;
          }
          reportPhysicalExamMinigame(
            "heent",
            recorded.action.result + (recorded.systemComplete ? " " + recorded.system.label + " examination complete." : "")
          );
        }, 900);
      }

      function pupilTick(frameTime) {
        if (finished) return;
        if (lastFrameTime === null) lastFrameTime = frameTime;
        const elapsedSeconds = Math.min((frameTime - lastFrameTime) / 1000, 0.08);
        lastFrameTime = frameTime;

        if (shining) {
          pupilSize -= constrictRate * elapsedSeconds;
        } else {
          pupilSize += dilationRate * elapsedSeconds;
        }
        pupilSize = clamp(pupilSize, 0.08, 0.96);

        if (pupilInZone(pupilSize)) stableTime += elapsedSeconds;
        else stableTime = 0;

        updateHud();
        drawGame();
        if (stableTime >= stableGoal) {
          finishPupilGame();
          return;
        }
        state.pupilFrame = requestAnimationFrame(pupilTick);
      }

      function updatePointer(event) {
        pointer = pointerPosition(event);
        if (shining) litEye = pointer.x < canvasWidth / 2 ? "right" : "left";
      }

      function beginLight(event) {
        if (event.button !== 0 || finished) return;
        event.preventDefault();
        pointerId = event.pointerId;
        updatePointer(event);
        shining = true;
        litEye = pointer.x < canvasWidth / 2 ? "right" : "left";
        canvas.setPointerCapture(pointerId);
      }

      function endLight(event) {
        if (event.pointerId !== pointerId) return;
        shining = false;
        if (canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
        pointerId = null;
      }

      canvas.addEventListener("pointerdown", beginLight);
      canvas.addEventListener("pointermove", updatePointer);
      canvas.addEventListener("pointerup", endLight);
      canvas.addEventListener("pointercancel", endLight);
      canvas.addEventListener("lostpointercapture", () => {
        shining = false;
        pointerId = null;
      });

      setMinigameAutowin(finishPupilGame);
      updateHud();
      drawGame();
      state.pupilFrame = requestAnimationFrame(pupilTick);
      canvas.focus({ preventScroll: true });
    }

    function openEarNoseInspectionGame() {
      const orifices = [
        { id: "rightEar", label: "Patient's right ear" },
        { id: "leftEar", label: "Patient's left ear" },
        { id: "rightNostril", label: "Patient's right nostril" },
        { id: "leftNostril", label: "Patient's left nostril" }
      ];
      let finished = false;

      if (!state.orificeAssignments) {
        const earQuestionId = Math.random() < 0.5 ? "rightEar" : "leftEar";
        const noseQuestionId = Math.random() < 0.5 ? "rightNostril" : "leftNostril";
        const remaining = orifices.map(item => item.id).filter(id => id !== earQuestionId && id !== noseQuestionId);
        if (Math.random() < 0.5) remaining.reverse();
        state.orificeAssignments = {
          [earQuestionId]: {
            kind: "question",
            bank: "ear",
            index: Math.floor(Math.random() * orificeQuestionBank.ear.length)
          },
          [noseQuestionId]: {
            kind: "question",
            bank: "nose",
            index: Math.floor(Math.random() * orificeQuestionBank.nose.length)
          },
          [remaining[0]]: { kind: "empty" },
          [remaining[1]]: { kind: "egg" }
        };
      }

      openModal(`
        <section class="modal-card orifice-card" id="orificeGame" role="dialog" aria-modal="true" aria-labelledby="orificeTitle">
          <div class="modal-header"><h2 id="orificeTitle">Ears and Nose Inspection</h2><button type="button" data-close aria-label="Close">X</button></div>
          <p>Inspect both ears and both nostrils. Two openings contain clinical questions; the remaining findings are less predictable.</p>
          <div class="orifice-progress-line">
            <span id="orificeProgressText">Examined 0 / 4</span>
            <div class="orifice-progress-pips" id="orificeProgressPips" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          </div>
          <div class="orifice-scene" aria-label="Front-facing view of the patient">
            <img src="assets/fronton.png" alt="Front-facing portrait of the patient">
            <button type="button" class="orifice-hotspot" data-orifice="rightEar" style="left:34.2%;top:37.2%;width:7.4%;height:16.5%" aria-label="Inspect the patient's right ear" title="Right ear"></button>
            <button type="button" class="orifice-hotspot" data-orifice="leftEar" style="left:59.2%;top:37.2%;width:7.4%;height:16.5%" aria-label="Inspect the patient's left ear" title="Left ear"></button>
            <button type="button" class="orifice-hotspot" data-orifice="rightNostril" style="left:46.1%;top:47.3%;width:5.2%;height:7.2%" aria-label="Inspect the patient's right nostril" title="Right nostril"></button>
            <button type="button" class="orifice-hotspot" data-orifice="leftNostril" style="left:51.2%;top:47.3%;width:5.2%;height:7.2%" aria-label="Inspect the patient's left nostril" title="Left nostril"></button>
          </div>
          <section class="orifice-panel" id="orificePanel" aria-live="polite"></section>
        </section>
      `);

      const panel = document.getElementById("orificePanel");
      const hotspotButtons = Array.from(document.querySelectorAll("[data-orifice]"));

      function completionKey(orificeId) {
        return "orifice:" + orificeId;
      }

      function examinedCount() {
        return orifices.filter(item => has(state.completed, completionKey(item.id))).length;
      }

      function updateOrificeProgress() {
        const count = examinedCount();
        document.getElementById("orificeProgressText").textContent = "Examined " + count + " / 4";
        document.querySelectorAll("#orificeProgressPips span").forEach((pip, index) => pip.classList.toggle("lit", index < count));
        hotspotButtons.forEach(button => {
          const examined = has(state.completed, completionKey(button.dataset.orifice));
          button.classList.toggle("examined", examined);
          button.setAttribute("aria-pressed", String(examined));
        });
      }

      function bindBackButton() {
        const backButton = document.getElementById("orificeBack");
        if (backButton) backButton.addEventListener("click", renderHomePanel);
      }

      function renderHomePanel() {
        panel.innerHTML = `
          <h3>Choose an opening</h3>
          <p>Select an ear or nostril on the portrait to inspect it.</p>
        `;
      }

      function renderResult(title, text, extraMarkup = "") {
        panel.innerHTML = `
          <h3>${escapeHtml(title)}</h3>
          ${extraMarkup}
          <p>${escapeHtml(text)}</p>
          <div class="orifice-panel-actions"><button type="button" class="primary-action" id="orificeBack">Back to Face</button></div>
        `;
        bindBackButton();
      }

      function finishOrificeGame() {
        if (finished) return;
        finished = true;
        setMinigameAutowin(null);
        orifices.forEach(item => markCompleted(completionKey(item.id)));
        addInventory("mysteryEgg");
        updateOrificeProgress();
        hotspotButtons.forEach(button => { button.disabled = true; });
        panel.innerHTML = `
          <h3>Inspection complete</h3>
          <p>Canals and nasal passages are patent without an acute abnormality. The mystery egg remains unexplained.</p>
        `;
        playSfx("success");

        setTimeout(() => {
          if (!document.getElementById("orificeGame")) return;
          const recorded = recordPhysicalExamAction("heent", "earsNose");
          if (!recorded) {
            closeModal();
            return;
          }
          reportPhysicalExamMinigame(
            "heent",
            recorded.action.result + " A mystery egg was also added to inventory." + (recorded.systemComplete ? " " + recorded.system.label + " examination complete." : "")
          );
        }, 900);
      }

      function markOrificeExamined(orificeId) {
        markCompleted(completionKey(orificeId));
        updateOrificeProgress();
        if (examinedCount() >= orifices.length) {
          finishOrificeGame();
          return true;
        }
        return false;
      }

      function renderQuestion(orifice, assignment) {
        const question = orificeQuestionBank[assignment.bank][assignment.index];
        panel.innerHTML = `
          <h3>${escapeHtml(orifice.label)}</h3>
          <p>${escapeHtml(question.prompt)}</p>
          <div class="orifice-answer-grid">
            ${question.options.map((option, index) => `<button type="button" class="orifice-answer" data-orifice-answer="${index}">${escapeHtml(option)}</button>`).join("")}
          </div>
          <p id="orificeQuestionFeedback" hidden></p>
        `;

        const answerButtons = Array.from(panel.querySelectorAll("[data-orifice-answer]"));
        answerButtons.forEach(button => {
          button.addEventListener("click", () => {
            const answerIndex = Number(button.dataset.orificeAnswer);
            const feedback = document.getElementById("orificeQuestionFeedback");
            if (answerIndex !== question.answer) {
              button.classList.add("wrong");
              feedback.hidden = false;
              feedback.textContent = "Not quite. Inspect the finding and try again.";
              return;
            }

            answerButtons.forEach(item => { item.disabled = true; });
            button.classList.add("correct");
            playSfx("success");
            if (markOrificeExamined(orifice.id)) return;
            renderResult(orifice.label, "Correct. " + question.explanation);
          });
        });
      }

      function inspectOrifice(orificeId) {
        if (finished) return;
        const orifice = orifices.find(item => item.id === orificeId);
        const assignment = state.orificeAssignments[orificeId];
        if (!orifice || !assignment) return;

        if (has(state.completed, completionKey(orificeId))) {
          renderResult(orifice.label, "This opening has already been inspected and documented.");
          return;
        }

        if (assignment.kind === "question") {
          renderQuestion(orifice, assignment);
          return;
        }

        if (assignment.kind === "egg") {
          addInventory("mysteryEgg");
          if (markOrificeExamined(orificeId)) return;
          renderResult(
            orifice.label,
            "Against all reasonable HEENT precedent, a small mystery egg is present. This is not a standard otoscopic or rhinoscopic finding.",
            `<div class="mystery-egg-reveal"><span aria-hidden="true">&#129370;</span>Mystery Egg acquired</div>`
          );
          return;
        }

        if (markOrificeExamined(orificeId)) return;
        renderResult(orifice.label, "Nothing unusual. Patent, unremarkable, and notably egg-free.");
      }

      hotspotButtons.forEach(button => button.addEventListener("click", () => inspectOrifice(button.dataset.orifice)));
      setMinigameAutowin(finishOrificeGame);
      updateOrificeProgress();
      renderHomePanel();
      if (examinedCount() >= orifices.length) finishOrificeGame();

    function openMentalStatusExamGame() {
      const today = new Date();
      const target = {
        month: today.getMonth() + 1,
        day: today.getDate(),
        year: today.getFullYear()
      };
      const modules = {
        month: { label: "Month", minimum: 1, maximum: 12, digits: 2 },
        day: { label: "Day", minimum: 1, maximum: 31, digits: 2 },
        year: { label: "Year", minimum: target.year - 20, maximum: target.year + 2, digits: 4 }
      };
      const values = {};
      let finished = false;

      function randomInteger(minimum, maximum) {
        return minimum + Math.floor(Math.random() * ((maximum - minimum) + 1));
      }

      do {
        values.month = randomInteger(modules.month.minimum, modules.month.maximum);
        values.day = randomInteger(modules.day.minimum, modules.day.maximum);
        values.year = randomInteger(modules.year.minimum, modules.year.maximum);
      } while (values.month === target.month && values.day === target.day && values.year === target.year);

      function digitMarkup(part) {
        return String(values[part])
          .padStart(modules[part].digits, "0")
          .split("")
          .map(digit => `<span class="mental-flip-digit">${digit}</span>`)
          .join("");
      }

      openModal(`
        <section class="modal-card mental-clock-card" id="mentalStatusGame" role="dialog" aria-modal="true" aria-labelledby="mentalStatusTitle">
          <div class="modal-header"><h2 id="mentalStatusTitle">Mental Status: Orientation to Date</h2><button type="button" data-close aria-label="Close">X</button></div>
          <p class="mental-clock-instructions">Set the clock to today's date on your local calendar. Use the arrows to roll the month, day, and year forward or backward.</p>
          <div class="mental-clock-housing">
            ${Object.keys(modules).map(part => `
              <section class="mental-clock-unit" aria-labelledby="mentalLabel-${part}">
                <span class="mental-clock-label" id="mentalLabel-${part}">${modules[part].label}</span>
                <button type="button" class="mental-clock-adjust" data-mental-part="${part}" data-mental-delta="1" aria-label="Increase ${modules[part].label.toLowerCase()}">&#9650;</button>
                <div class="mental-flip-display" id="mentalDisplay-${part}" role="status" aria-label="${modules[part].label} ${values[part]}">
                  ${digitMarkup(part)}
                </div>
                <button type="button" class="mental-clock-adjust" data-mental-part="${part}" data-mental-delta="-1" aria-label="Decrease ${modules[part].label.toLowerCase()}">&#9660;</button>
              </section>
            `).join("")}
          </div>
          <p class="mental-clock-status" id="mentalClockStatus" aria-live="polite">Align all three modules with the current local date.</p>
        </section>
      `);

      const status = document.getElementById("mentalClockStatus");
      const controls = Array.from(document.querySelectorAll("[data-mental-part]"));
      const formattedDate = today.toLocaleDateString(undefined, {
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      function valueMatches(part) {
        return values[part] === target[part];
      }

      function renderModule(part, direction = 0) {
        const display = document.getElementById("mentalDisplay-" + part);
        const digits = String(values[part]).padStart(modules[part].digits, "0").split("");
        display.querySelectorAll(".mental-flip-digit").forEach((element, index) => {
          element.textContent = digits[index];
        });
        display.setAttribute("aria-label", modules[part].label + " " + values[part]);
        display.classList.toggle("correct", valueMatches(part));
        if (!direction) return;

        display.classList.remove("flip-up", "flip-down");
        void display.offsetWidth;
        display.classList.add(direction > 0 ? "flip-up" : "flip-down");
        clearTimeout(display.flipTimer);
        display.flipTimer = setTimeout(() => {
          display.classList.remove("flip-up", "flip-down");
        }, 200);
      }

      function wrapValue(value, minimum, maximum) {
        if (value > maximum) return minimum;
        if (value < minimum) return maximum;
        return value;
      }

      function dateIsCorrect() {
        return Object.keys(modules).every(valueMatches);
      }

      function finishMentalStatusExam() {
        if (finished) return;
        finished = true;
        Object.keys(modules).forEach(part => {
          values[part] = target[part];
          renderModule(part);
        });
        controls.forEach(button => { button.disabled = true; });
        setMinigameAutowin(null);
        status.className = "mental-clock-status success";
        status.textContent = "Correctly oriented to " + formattedDate + ".";
        playSfx("success");

        setTimeout(() => {
          if (!document.getElementById("mentalStatusGame")) return;
          markCompleted("mentalStatusDateGame");
          addFinding("mentalStatus");
          reportPhysicalExamMinigame(
            "neurologic",
            "The patient correctly identifies " + formattedDate + " and is alert, attentive, fully oriented, and able to provide a coherent history."
          );
        }, 900);
      }

      function adjustDate(event) {
        if (finished) return;
        const button = event.currentTarget;
        const part = button.dataset.mentalPart;
        const direction = Number(button.dataset.mentalDelta);
        const module = modules[part];
        values[part] = wrapValue(values[part] + direction, module.minimum, module.maximum);
        renderModule(part, direction);
        playSfx("click");

        if (dateIsCorrect()) {
          finishMentalStatusExam();
          return;
        }
        const matchedCount = Object.keys(modules).filter(valueMatches).length;
        status.className = "mental-clock-status";
        status.textContent = matchedCount
          ? matchedCount + " of 3 date modules correctly oriented."
          : "Align all three modules with the current local date.";
      }

      controls.forEach(button => button.addEventListener("click", adjustDate));
      Object.keys(modules).forEach(part => renderModule(part));
      setMinigameAutowin(finishMentalStatusExam);
      controls[0].focus({ preventScroll: true });
    }

      }
      if (exam === "reflex") {

    function openCranialNerveGame() {
      const canvasWidth = 960;
      const canvasHeight = 640;
      const traceWidth = 12;
      const coverageRadius = 9;
      const requiredCoverage = 0.9;
      const sampleSpacing = 4;
      const targetSegments = [
        { label: "left vertical bar", start: { x: 270, y: 165 }, end: { x: 270, y: 475 } },
        { label: "crossbar", start: { x: 270, y: 320 }, end: { x: 690, y: 320 } },
        { label: "right vertical bar", start: { x: 690, y: 165 }, end: { x: 690, y: 475 } }
      ];
      const strokes = [];
      let activeStroke = null;
      let drawing = false;
      let finished = false;

      openModal(`
        <section class="modal-card cranial-card" id="cranialGame" role="dialog" aria-modal="true" aria-labelledby="cranialTitle">
          <div class="modal-header"><h2 id="cranialTitle">Cranial Nerve Screen: Follow My Finger</h2><button type="button" data-close aria-label="Close">X</button></div>
          <p>Click and hold to trace the entire dotted H in one continuous movement. Releasing checks the trace.</p>
          <div class="cranial-stage" id="cranialStage">
            <canvas class="cranial-guide-layer" id="cranialGuideCanvas" width="960" height="640" aria-hidden="true"></canvas>
            <canvas class="cranial-draw-layer" id="cranialCanvas" width="960" height="640" tabindex="0" aria-describedby="cranialFeedback" aria-label="Draw red lines over the dotted H"></canvas>
          </div>
          <p class="cranial-feedback" id="cranialFeedback" aria-live="polite" hidden></p>
        </section>
      `);

      const guideCanvas = document.getElementById("cranialGuideCanvas");
      const guideContext = guideCanvas.getContext("2d");
      const canvas = document.getElementById("cranialCanvas");
      const context = canvas.getContext("2d");
      const feedback = document.getElementById("cranialFeedback");

      function pointerPosition(event) {
        const bounds = canvas.getBoundingClientRect();
        return {
          x: ((event.clientX - bounds.left) / bounds.width) * canvasWidth,
          y: ((event.clientY - bounds.top) / bounds.height) * canvasHeight
        };
      }

      function drawGuide() {
        guideContext.clearRect(0, 0, canvasWidth, canvasHeight);
        guideContext.save();
        guideContext.strokeStyle = "rgba(255,243,191,0.94)";
        guideContext.lineWidth = 5;
        guideContext.setLineDash([11, 10]);
        guideContext.shadowColor = "rgba(33,25,35,0.9)";
        guideContext.shadowOffsetX = 3;
        guideContext.shadowOffsetY = 3;
        guideContext.beginPath();
        targetSegments.forEach(segment => {
          guideContext.moveTo(segment.start.x, segment.start.y);
          guideContext.lineTo(segment.end.x, segment.end.y);
        });
        guideContext.stroke();
        guideContext.restore();
      }

      function drawTracePoint(point) {
        context.save();
        context.fillStyle = "rgba(207,48,43,0.9)";
        context.beginPath();
        context.arc(point.x, point.y, traceWidth / 2, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }

      function drawTraceSegment(start, end) {
        context.save();
        context.strokeStyle = "rgba(207,48,43,0.9)";
        context.lineWidth = traceWidth;
        context.lineCap = "round";
        context.lineJoin = "round";
        context.beginPath();
        context.moveTo(start.x, start.y);
        context.lineTo(end.x, end.y);
        context.stroke();
        context.restore();
      }

      function beginStroke(event) {
        if (event.button !== 0 || finished) return;
        event.preventDefault();
        feedback.hidden = true;
        context.clearRect(0, 0, canvasWidth, canvasHeight);
        strokes.length = 0;
        drawing = true;
        activeStroke = [pointerPosition(event)];
        strokes.push(activeStroke);
        canvas.setPointerCapture(event.pointerId);
        drawTracePoint(activeStroke[0]);
      }

      function continueStroke(event) {
        if (!drawing || finished || !activeStroke) return;
        event.preventDefault();
        const point = pointerPosition(event);
        const previous = activeStroke[activeStroke.length - 1];
        if (Math.hypot(point.x - previous.x, point.y - previous.y) < 1) return;
        activeStroke.push(point);
        drawTraceSegment(previous, point);
      }

      function pointToSegmentDistance(point, start, end) {
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const lengthSquared = (dx * dx) + (dy * dy);
        if (!lengthSquared) return Math.hypot(point.x - start.x, point.y - start.y);
        const progress = Math.max(0, Math.min(1, (((point.x - start.x) * dx) + ((point.y - start.y) * dy)) / lengthSquared));
        const nearestX = start.x + (dx * progress);
        const nearestY = start.y + (dy * progress);
        return Math.hypot(point.x - nearestX, point.y - nearestY);
      }

      function traceCoversPoint(point) {
        return strokes.some(stroke => {
          if (stroke.length === 1) {
            return Math.hypot(point.x - stroke[0].x, point.y - stroke[0].y) <= coverageRadius;
          }
          for (let index = 1; index < stroke.length; index += 1) {
            if (pointToSegmentDistance(point, stroke[index - 1], stroke[index]) <= coverageRadius) return true;
          }
          return false;
        });
      }

      function segmentCoverage(segment) {
        const length = Math.hypot(segment.end.x - segment.start.x, segment.end.y - segment.start.y);
        const sampleCount = Math.ceil(length / sampleSpacing);
        let covered = 0;
        for (let index = 0; index <= sampleCount; index += 1) {
          const progress = index / sampleCount;
          const point = {
            x: segment.start.x + ((segment.end.x - segment.start.x) * progress),
            y: segment.start.y + ((segment.end.y - segment.start.y) * progress)
          };
          if (traceCoversPoint(point)) covered += 1;
        }
        return covered / (sampleCount + 1);
      }

      function finishCranialGame() {
        if (finished) return;
        finished = true;
        drawing = false;
        activeStroke = null;
        setMinigameAutowin(null);
        feedback.hidden = false;
        feedback.className = "cranial-feedback success";
        feedback.textContent = "The H pattern is covered. Extraocular movements are conjugate and complete.";
        playSfx("success");

        setTimeout(() => {
          if (!document.getElementById("cranialGame")) return;
          markCompleted("cranialNerveGame");
          addFinding("cranialNerves");
          reportPhysicalExamMinigame(
            "neurologic",
            "Focused cranial nerve screen complete: visual fields are full, pupils are reactive, extraocular movements are intact, facial sensation and movement are symmetric, hearing is intact, palate elevation is symmetric, shoulder strength is full, and the tongue is midline."
          );
        }, 850);
      }

      function clearTrace(message) {
        drawing = false;
        activeStroke = null;
        strokes.length = 0;
        context.clearRect(0, 0, canvasWidth, canvasHeight);
        feedback.hidden = false;
        feedback.className = "cranial-feedback warning";
        feedback.textContent = message;
      }

      function submitTrace() {
        if (finished) return;
        const coverage = targetSegments.map(segmentCoverage);
        const incompleteIndex = coverage.findIndex(value => value <= requiredCoverage);
        if (incompleteIndex === -1) {
          finishCranialGame();
          return;
        }

        clearTrace("Trace reset. Keep holding and cover the " + targetSegments[incompleteIndex].label + " as part of one continuous H.");
        canvas.focus({ preventScroll: true });
      }

      function endStroke(event) {
        if (!drawing) return;
        continueStroke(event);
        drawing = false;
        activeStroke = null;
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        submitTrace();
      }

      function cancelStroke(event) {
        if (!drawing) return;
        drawing = false;
        activeStroke = null;
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        clearTrace("Trace reset. Keep the pointer held down for the entire H.");
      }

      canvas.addEventListener("pointerdown", beginStroke);
      canvas.addEventListener("pointermove", continueStroke);
      canvas.addEventListener("pointerup", endStroke);
      canvas.addEventListener("pointercancel", cancelStroke);
      canvas.addEventListener("lostpointercapture", cancelStroke);

      setMinigameAutowin(finishCranialGame);
      drawGuide();
      canvas.focus({ preventScroll: true });
    }

      const boostPerClick = 20;

      let finished = false;

      openModal(`
        <section class="modal-card sensory-card" id="sensoryGame" role="dialog" aria-modal="true" aria-labelledby="sensoryTitle">
          <div class="modal-header"><h2 id="sensoryTitle">Five-Modality Sensory Testing</h2><button type="button" data-close aria-label="Close">X</button></div>
          <p>Build every modality to 100% at the same time. A full meter locks briefly; unlocked meters steadily decay.</p>

      function renderSensoryMeters(now) {
        modalities.forEach(modality => {
          const meter = meters[modality.id];

          );

      }

      function checkSensoryWin() {
        if (modalities.every(modality => meters[modality.id].value >= 100)) finishSensoryGame();
      }

      function activateSensoryTool(toolId) {
        if (finished) return;
        const tool = toolById.get(toolId);
        if (!tool) return;
        const now = performance.now();

        if (!tool.modalityId) {
          modalities.forEach(modality => {
            const meter = meters[modality.id];
            if (meter.lockedUntil <= now) meter.value = Math.max(0, meter.value - distractorPenalty);
          });
          feedback.className = "sensory-feedback penalty";
          feedback.textContent = tool.response + " Unlocked meters lose " + distractorPenalty + "%.";
          renderSensoryMeters(now);
          return;
        }

        const modality = modalities.find(item => item.id === tool.modalityId);
        const meter = meters[tool.modalityId];
        if (meter.lockedUntil > now) {
          feedback.className = "sensory-feedback";
          feedback.textContent = modality.label + " is locked at 100%. Switch to another modality.";
          return;
        }

        meter.value = Math.min(100, meter.value + boostPerClick);
        feedback.className = "sensory-feedback";
        feedback.textContent = tool.response;
        if (meter.value >= 100) {
          meter.value = 100;
          meter.lockedUntil = now + lockDuration;
          feedback.className = "sensory-feedback success";
          feedback.textContent = modality.label + " secured for five seconds. Switch modalities.";
          playSfx("success");
        }
        renderSensoryMeters(now);
        checkSensoryWin();
      }

      function sensoryTick(frameTime) {
        if (finished) return;
        if (lastFrameTime === null) lastFrameTime = frameTime;
        const elapsedSeconds = Math.min((frameTime - lastFrameTime) / 1000, 0.1);
        lastFrameTime = frameTime;

        modalities.forEach(modality => {
          const meter = meters[modality.id];
          if (meter.lockedUntil > frameTime) {
            meter.value = 100;
            return;
          }
          if (meter.lockedUntil) meter.lockedUntil = 0;
          meter.value = Math.max(0, meter.value - decayPerSecond * elapsedSeconds);
        });
        renderSensoryMeters(frameTime);
        state.sensoryFrame = requestAnimationFrame(sensoryTick);
      }

      document.querySelectorAll("[data-sensory-tool]").forEach(button => {
        button.addEventListener("pointerdown", event => {
          if (event.button !== 0) return;
          event.preventDefault();
          activateSensoryTool(button.dataset.sensoryTool);
        });
        button.addEventListener("keydown", event => {
          if (event.repeat || (event.key !== "Enter" && event.key !== " ")) return;
          event.preventDefault();
          activateSensoryTool(button.dataset.sensoryTool);
        });
      });

      setMinigameAutowin(finishSensoryGame);
      renderSensoryMeters(performance.now());
      state.sensoryFrame = requestAnimationFrame(sensoryTick);
      document.querySelector("[data-sensory-tool]").focus();
    }

    function openCoordinationGame() {
      const targetCount = 4;
      const cycleDuration = 2100;
      const hitWindowStart = 0.86;
      let activeTarget = 0;
      let cycleElapsed = 0;
      let lastFrameTime = null;
      let finished = false;

      openModal(`
        <section class="modal-card coordination-card" role="dialog" aria-modal="true" aria-labelledby="coordinationTitle">
          <div class="modal-header"><h2 id="coordinationTitle">Coordination Sequence</h2><button type="button" data-close aria-label="Close">X</button></div>
          <p>Four targets activate in order. Click the active button when its closing ring reaches the button edge.</p>
          <div class="coordination-board" id="coordinationBoard">
            ${Array.from({ length: targetCount }, (_, index) => `
              <button type="button" class="coordination-target${index === 0 ? " active" : ""}" data-coordination-target="${index}" aria-label="Coordination target ${index + 1}">
                <span class="coordination-ring" aria-hidden="true"></span>
                <span class="coordination-core" aria-hidden="true">${index + 1}</span>
              </button>
            `).join("")}
          </div>
          <div class="coordination-progress-line">
            <span id="coordinationStation">Target 1 of 4</span>
            <div class="coordination-progress" id="coordinationProgress" aria-label="0 of 4 targets complete">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
          <p class="coordination-feedback" id="coordinationFeedback" aria-live="polite">Follow the outer ring on target 1 and click as it meets the central button.</p>
        </section>
      `);

      const board = document.getElementById("coordinationBoard");
      const targets = Array.from(document.querySelectorAll("[data-coordination-target]"));
      const progress = document.getElementById("coordinationProgress");
      const progressPips = Array.from(progress.querySelectorAll("span"));
      const station = document.getElementById("coordinationStation");
      const feedback = document.getElementById("coordinationFeedback");

      function stopCoordinationMotion() {
        if (!state.timingFrame) return;
        cancelAnimationFrame(state.timingFrame);
        state.timingFrame = null;
      }

      function renderCoordinationTargets() {
        targets.forEach((target, index) => {
          const completed = index < activeTarget || finished;
          const active = index === activeTarget && !finished;
          target.classList.toggle("completed", completed);
          target.classList.toggle("active", active);
          target.disabled = completed || finished;
          target.querySelector(".coordination-core").textContent = completed ? "\u2713" : String(index + 1);
        });
        progressPips.forEach((pip, index) => pip.classList.toggle("lit", index < activeTarget || finished));
        progress.setAttribute("aria-label", (finished ? targetCount : activeTarget) + " of " + targetCount + " targets complete");
        station.textContent = finished ? "Sequence complete" : "Target " + (activeTarget + 1) + " of " + targetCount;
      }

      function finishCoordinationGame() {
        if (finished) return;
        finished = true;
        activeTarget = targetCount;
        setMinigameAutowin(null);
        stopCoordinationMotion();
        renderCoordinationTargets();
        feedback.className = "coordination-feedback hit";
        feedback.textContent = "All four targets were acquired in sequence with accurate timing.";
        playSfx("success");

        setTimeout(() => {
          if (!document.getElementById("coordinationBoard")) return;
          addFinding("coordination");
          reportPhysicalExamMinigame(
            "neurologic",
            "Finger-to-nose and right heel-to-shin are accurate. Left heel-to-shin is limited by weakness without clear dysmetria."
          );
        }, 750);
      }

      function advanceCoordinationTarget() {
        activeTarget += 1;
        cycleElapsed = 0;
        lastFrameTime = null;
        if (activeTarget >= targetCount) {
          finishCoordinationGame();
          return;
        }
        renderCoordinationTargets();
        feedback.className = "coordination-feedback hit";
        feedback.textContent = "Accurate timing. Target " + (activeTarget + 1) + " is now active.";
      }

      function attemptCoordinationTarget(event) {
        if (finished) return;
        const selectedTarget = Number(event.currentTarget.dataset.coordinationTarget);
        if (selectedTarget !== activeTarget) {
          feedback.className = "coordination-feedback miss";
          feedback.textContent = "Targets are tested in order. Follow the closing ring on target " + (activeTarget + 1) + ".";
          return;
        }

        const cycleProgress = cycleElapsed / cycleDuration;
        if (cycleProgress < hitWindowStart) {
          cycleElapsed = 0;
          lastFrameTime = null;
          feedback.className = "coordination-feedback miss";
          feedback.textContent = "Too early. Let the outer ring reach the edge of the central button.";
          return;
        }

        playSfx("success");
        advanceCoordinationTarget();
      }

      function animateCoordination(frameTime) {
        if (finished || !board.isConnected) return;
        if (lastFrameTime === null) lastFrameTime = frameTime;
        const frameDelta = Math.min(frameTime - lastFrameTime, 100);
        lastFrameTime = frameTime;
        cycleElapsed += frameDelta;

        if (cycleElapsed >= cycleDuration) {
          cycleElapsed %= cycleDuration;
          feedback.className = "coordination-feedback";
          feedback.textContent = "The ring closed. Keep target " + (activeTarget + 1) + " in view and catch the next cycle.";
        }

        const cycleProgress = cycleElapsed / cycleDuration;
        const ringScale = 1 + ((1 - cycleProgress) * 1.25);
        const target = targets[activeTarget];
        if (target) {
          target.querySelector(".coordination-ring").style.setProperty("--coordination-ring-scale", ringScale.toFixed(3));
          target.classList.toggle("in-window", cycleProgress >= hitWindowStart);
        }
        state.timingFrame = requestAnimationFrame(animateCoordination);
      }

      targets.forEach(target => target.addEventListener("click", attemptCoordinationTarget));
      renderCoordinationTargets();
      setMinigameAutowin(finishCoordinationGame);
      state.timingFrame = requestAnimationFrame(animateCoordination);
      targets[0].focus({ preventScroll: true });
    }

    function reflexContactAt(position) {
      if (position < 22) {
        return "You struck the distal quadriceps above the knee. Muscle is not the patellar tendon.";
      }
      if (position < 33) {
        return "You tapped the patella itself. Move just inferior to the kneecap to find the tendon.";
      }
      if (position <= 40) {
        return "Patellar tendon";
      }
      if (position < 50) {
        return "You struck the tibial tuberosity, the bony insertion below the tendon.";
      }
      if (position < 76) {
        return "You tapped the tibial shaft, commonly called the shin.";
      }
      return "You reached the ankle and foot, well below the knee reflex arc.";
    }

    function openReflexGame() {
      let direction = 1;
      let hitStreak = 0;
      let missStreak = 0;
      let strikeLocked = false;
      let reflexFinished = false;
      let lastFrameTime = null;

      state.timingMarker = 12;
      state.timingHits = 0;
      openModal(`
        <section class="modal-card reflex-card" role="dialog" aria-modal="true" aria-labelledby="reflexTitle">
          <div class="modal-header"><h2 id="reflexTitle">Patellar Reflex</h2><button type="button" data-close aria-label="Close">X</button></div>
          <p>Click when the moving hammer is aligned with the patellar tendon. Three accurate strikes in a row document the reflex; three consecutive misses end the attempt.</p>
          <div class="reflex-layout">
            <button type="button" class="reflex-stage" id="reflexStage" aria-label="Strike when the hammer aligns with the patellar tendon">
              <img class="reflex-leg" src="assets/reflex-leg.png" alt="Anterior view of the patient's left leg">
              <span class="reflex-target" id="reflexTarget" aria-hidden="true"><span>Patellar tendon</span></span>
              <span class="reflex-hammer" id="reflexHammer" aria-hidden="true"><span class="reflex-hammer-icon">&#128296;</span></span>
            </button>
            <section class="reflex-controls">
              <div class="reflex-streaks">
                <div class="reflex-streak">
                  <strong>Hit streak</strong>
                  <div class="reflex-pips reflex-hit-pips" id="reflexHitPips"><span></span><span></span><span></span></div>
                </div>
                <div class="reflex-streak">
                  <strong>Miss streak</strong>
                  <div class="reflex-pips reflex-miss-pips" id="reflexMissPips"><span></span><span></span><span></span></div>
                </div>
              </div>
              <p class="reflex-feedback" id="reflexFeedback" aria-live="polite">Follow the hammer vertically and strike as its head crosses the tendon just below the patella.</p>
              <button type="button" class="primary-action reflex-strike-button" id="reflexStrike">Strike &#128296;</button>
            </section>
          </div>
        </section>
      `);

      const hammer = document.getElementById("reflexHammer");
      const stage = document.getElementById("reflexStage");
      const target = document.getElementById("reflexTarget");
      const strikeButton = document.getElementById("reflexStrike");
      const feedback = document.getElementById("reflexFeedback");

      function renderReflexStreaks() {
        document.querySelectorAll("#reflexHitPips span").forEach((pip, index) => pip.classList.toggle("lit", index < hitStreak));
        document.querySelectorAll("#reflexMissPips span").forEach((pip, index) => pip.classList.toggle("lit", index < missStreak));
      }

      function stopReflexMotion() {
        if (state.timingFrame) {
          cancelAnimationFrame(state.timingFrame);
          state.timingFrame = null;
        }
        stage.disabled = true;
        strikeButton.disabled = true;
      }

      function measureReflexStrike() {
        const hammerRect = hammer.getBoundingClientRect();
        const targetRect = target.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();
        const indicatorY = hammerRect.top + (hammerRect.height / 2);
        const trackTop = stageRect.top + stage.clientTop;
        const position = ((indicatorY - trackTop) / stage.clientHeight) * 100;

        return {
          position,
          accurate: indicatorY >= targetRect.top && indicatorY <= targetRect.bottom
        };
      }

      function finishReflexSuccess() {
        if (reflexFinished) return;
        reflexFinished = true;
        setMinigameAutowin(null);
        stopReflexMotion();
        feedback.className = "reflex-feedback hit";
        feedback.textContent = "Patellar tendon again. Three brisk responses in a row document left patellar hyperreflexia.";
        strikeButton.textContent = "Reflex documented";
        setTimeout(() => {
          if (!document.getElementById("reflexStage")) return;
          addFinding("reflexes");
          removeInventory("hammer");
          reportPhysicalExamMinigame(
            "neurologic",
            "Repeated left patellar tendon strikes produce a brisk knee jerk, supporting corticospinal tract involvement."
          );
        }, 900);
      }

      function finishReflexFailure(lastContact) {
        if (reflexFinished) return;
        reflexFinished = true;
        setMinigameAutowin(null);
        stopReflexMotion();
        feedback.className = "reflex-feedback miss";
        feedback.textContent = lastContact + " Three misses in a row end this attempt.";
        strikeButton.textContent = "Attempt ended";
        setTimeout(() => {
          if (!document.getElementById("reflexStage")) return;
          reportPhysicalExamMinigame(
            "neurologic",
            "\"Maybe try again later,\" the patient says. The reflex hammer remains available for another attempt."
          );
        }, 1150);
      }

      function strikeReflex() {
        if (strikeLocked || stage.disabled) return;
        strikeLocked = true;
        setTimeout(() => { strikeLocked = false; }, 240);

        const strike = measureReflexStrike();
        state.timingMarker = strike.position;
        const contact = reflexContactAt(strike.position);
        const accurate = strike.accurate;
        if (accurate) {
          hitStreak += 1;
          missStreak = 0;
          state.timingHits = hitStreak;
          feedback.className = "reflex-feedback hit";
          feedback.textContent = "Patellar tendon. The left lower leg extends briskly. Hit streak " + hitStreak + " of 3.";
          playSfx("success");
          renderReflexStreaks();
          if (hitStreak >= 3) finishReflexSuccess();
          return;
        }

        missStreak += 1;
        hitStreak = 0;
        state.timingHits = 0;
        feedback.className = "reflex-feedback miss";
        feedback.textContent = contact + " Miss streak " + missStreak + " of 3.";
        renderReflexStreaks();
        if (missStreak >= 3) finishReflexFailure(contact);
      }

      function moveReflexHammer(frameTime) {
        if (lastFrameTime === null) lastFrameTime = frameTime;
        const elapsedSeconds = Math.min((frameTime - lastFrameTime) / 1000, 0.1);
        lastFrameTime = frameTime;
        state.timingMarker += direction * 32.5 * elapsedSeconds;
        if (state.timingMarker >= 88) {
          state.timingMarker = 88;
          direction = -1;
        } else if (state.timingMarker <= 10) {
          state.timingMarker = 10;
          direction = 1;
        }
        hammer.style.top = state.timingMarker + "%";
        state.timingFrame = requestAnimationFrame(moveReflexHammer);
      }

      function strikeFromPointer(event) {
        event.preventDefault();
        strikeReflex();
      }

      function strikeFromKeyboard(event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        strikeReflex();
      }

      hammer.style.top = state.timingMarker + "%";
      state.timingFrame = requestAnimationFrame(moveReflexHammer);

      stage.addEventListener("pointerdown", strikeFromPointer);
      strikeButton.addEventListener("pointerdown", strikeFromPointer);
      stage.addEventListener("keydown", strikeFromKeyboard);
      strikeButton.addEventListener("keydown", strikeFromKeyboard);
      setMinigameAutowin(finishReflexSuccess);
      strikeButton.focus();
    }
