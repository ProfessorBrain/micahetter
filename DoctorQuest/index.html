<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor Quest: The Curious Casebook of Dr. Click - Local HTML</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --ink: #211923;
      --paper: #f7edcf;
      --gold: #d7aa44;
      --maroon: #5c1f31;
      --teal: #1f6f78;
      --clinic-green: #7ea687;
      --brick: #9b4d45;
      --retro-font: "Courier New", Courier, "Lucida Console", Monaco, monospace;
      --emoji-font: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 20% 12%, rgba(215, 170, 68, 0.2), transparent 28rem),
        linear-gradient(135deg, #1d3f47 0%, #2d2034 48%, #5c2a32 100%);
      color: var(--paper);
      font-family: var(--retro-font);
    }

    button { font: inherit; }

    .game-root {
      --game-pad: clamp(4px, 1vh, 14px);
      height: 100dvh;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: var(--game-pad);
      overflow: hidden;
    }

    .game-root.cursor-active, .game-root.cursor-active * { cursor: none; }

    .emoji-cursor {
      position: fixed;
      z-index: 80;
      display: none;
      pointer-events: none;
      font-family: var(--emoji-font);
      font-size: 28px;
      line-height: 1;
      filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.55));
      transform: translate(-50%, -50%);
    }

    .emoji-cursor.visible { display: block; }

    .emoji-cursor.inventory-selected {
      width: 54px;
      height: 62px;
      align-items: flex-start;
      justify-content: flex-start;
      transform: translate(-16%, -14%);
    }

    .emoji-cursor.inventory-selected.visible { display: flex; }

    .inventory-cursor-art {
      max-width: 48px;
      max-height: 60px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.58));
    }

    .inventory-cursor-symbol {
      font-family: var(--emoji-font);
      font-size: 34px;
      line-height: 1;
      filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.58));
    }

    .game-cabinet {
      width: min(1320px, 100%);
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      border: 5px solid #180f17;
      background: #2a1824;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      overflow: hidden;
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.4),
        inset 0 0 0 4px #b58337,
        inset 0 0 0 8px #3a283a;
    }

    .game-header {
      padding: 4px 12px;
      border-bottom: 3px solid #130b12;
      background:
        linear-gradient(90deg, rgba(126, 166, 135, 0.36), transparent 32%),
        linear-gradient(180deg, #5c1f31 0%, #341927 100%);
    }

    .game-header > div {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .top-toolbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      padding: 3px 8px;
      border-bottom: 3px solid #130b12;
      background: linear-gradient(180deg, #34213a, var(--ink));
    }

    .tool-strip {
      display: flex;
      gap: 5px;
      flex-wrap: nowrap;
      align-items: stretch;
      flex: 0 0 auto;
    }

    .tool-button {
      position: relative;
      min-height: 42px;
      min-width: 42px;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      border: 3px outset var(--gold);
      border-radius: 0;
      background: linear-gradient(180deg, #f6e2a6, #b98443);
      color: var(--ink);
      font-family: var(--retro-font);
      font-size: 1.25rem;
      line-height: 1;
      appearance: none;
      -webkit-appearance: none;
      touch-action: manipulation;
    }

    .tool-button > * { pointer-events: none; }

    .tool-button.selected {
      border-style: inset;
      background: linear-gradient(180deg, #91d8c5, var(--teal));
      color: var(--paper);
    }

    .tool-icon {
      font-family: var(--emoji-font);
      font-size: 1.22rem;
      line-height: 1;
    }

    .top-inventory {
      height: 46px;
      min-height: 46px;
      max-height: 46px;
      display: flex;
      align-items: center;
      flex: 1 1 220px;
      min-width: 140px;
      padding: 2px 6px;
      border: 3px ridge var(--gold);
      background: #302831;
      overflow: hidden;
    }

    .toolbar-spacer { flex: 1 1 auto; }

    .toolbar-menu {
      position: relative;
      display: flex;
      align-items: stretch;
      flex: 0 1 136px;
    }

    .settings-menu {
      flex: 0 0 42px;
    }

    .toolbar-menu-button,
    .chart-review-button {
      position: relative;
      z-index: 30;
      min-height: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 0;
      padding: 7px 12px;
      border: 3px outset var(--gold);
      border-radius: 0;
      background: linear-gradient(180deg, #fff0b8, var(--gold));
      color: var(--ink);
      font-family: var(--retro-font);
      font-size: 0.78rem;
      line-height: 1;
      user-select: none;
      appearance: none;
      -webkit-appearance: none;
      touch-action: manipulation;
    }

    .chart-review-button {
      min-width: 112px;
      flex: 0 1 136px;
    }

    .toolbar-menu-button:after { content: "\25BE"; margin-left: 8px; }

    .settings-menu .toolbar-menu-button {
      padding: 0;
      color: var(--ink);
      font-family: var(--retro-font);
      font-size: 1.45rem;
      font-weight: 900;
    }

    .settings-menu .toolbar-menu-button:after {
      content: "";
      margin-left: 0;
    }

    .toolbar-menu.open .toolbar-menu-button {
      border-style: inset;
      background: linear-gradient(180deg, #f7edcf, #d7aa44);
    }

    .menu-panel {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      z-index: 24;
      width: 248px;
      padding: 10px;
      border: 4px ridge var(--gold);
      background: var(--ink);
      box-shadow: 0 14px 30px rgba(0,0,0,0.45);
    }

    .menu-panel[hidden] { display: none; }

    .menu-item {
      width: 100%;
      margin-bottom: 8px;
      padding: 9px;
      border: 3px ridge var(--gold);
      background: var(--paper);
      color: var(--ink);
      text-align: left;
    }

    .menu-item span {
      display: block;
      margin-top: 4px;
      color: var(--maroon);
      font-family: var(--retro-font);
      font-size: 0.66rem;
      text-transform: uppercase;
    }

    .menu-item.locked { filter: saturate(0.65); opacity: 0.78; }

    .menu-note {
      padding: 8px;
      border: 2px solid rgba(247,237,207,0.55);
      color: var(--paper);
      font-family: var(--retro-font);
      font-size: 0.68rem;
      line-height: 1.35;
    }

    .music-control {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
      padding: 8px;
      border: 2px solid rgba(247,237,207,0.55);
      background: rgba(247,237,207,0.08);
      color: var(--paper);
      font-family: var(--retro-font);
      font-size: 0.68rem;
    }

    .music-control label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-transform: uppercase;
    }

    .music-control input[type="range"] {
      width: 100%;
      accent-color: var(--gold);
    }

    .music-control .menu-item { margin-bottom: 0; }

    .eyebrow, .game-header h1 { margin: 0; }

    .eyebrow {
      color: #f2ce77;
      font-family: var(--retro-font);
      flex: 0 0 auto;
      font-size: 0.64rem;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .game-header h1 {
      min-width: 0;
      color: #fff3bf;
      font-size: clamp(0.9rem, 1.65vw, 1.18rem);
      line-height: 1.08;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 2px 2px 0 #1b1019;
      white-space: nowrap;
    }

    .game-header .eyebrow { margin-top: 0; }

    .adventure-frame {
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-bottom: 4px solid #130b12;
      background: #09090a;
      container-type: size;
    }

    .room-scene {
      position: relative;
      width: 100%;
      max-height: 100%;
      aspect-ratio: 1448 / 1086;
      min-height: 0;
      overflow: hidden;
      background: #09090a;
      image-rendering: pixelated;
    }

    @supports (width: 1cqw) {
      .room-scene {
        width: min(100cqw, calc(100cqh * 1448 / 1086));
        height: min(100cqh, calc(100cqw * 1086 / 1448));
        max-height: none;
      }
    }

    .scene-art, .back-wall, .floor-shadow, .door-art, .bed-art,
    .tray-art, .cart-art, .cabinet-art, .ct-lightbox,
    .monitor-art, .phone-art { position: absolute; }

    .scene-art {
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .scene-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: pixelated;
    }

    .back-wall {
      inset: 0 0 28%;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.08) 0 2px, transparent 2px 72px),
        linear-gradient(180deg, rgba(255,255,255,0.12), transparent 48%);
    }

    .floor-shadow {
      left: 12%; right: 7%; bottom: 9%; height: 15%;
      border-radius: 50%;
      background: rgba(19, 11, 18, 0.36);
    }

    .door-art {
      left: 0.8%; top: 27%; width: 8%; height: 49%;
      border: 5px solid #362230;
      background: linear-gradient(90deg, #34535c, #20343f);
      box-shadow: inset -8px 0 0 rgba(0,0,0,0.22);
    }

    .door-art:after {
      content: "";
      position: absolute;
      right: 12%; top: 48%;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold);
    }

    .ct-lightbox {
      left: 9%; top: 16%; width: 17%; height: 25%;
      border: 5px ridge #6e7f8d;
      background: #d9e2d8;
      box-shadow: 0 8px 0 rgba(0,0,0,0.22);
    }

    .ct-lightbox span {
      position: absolute;
      top: 16%; width: 32%; height: 66%;
      border-radius: 48%;
      border: 7px solid #515b61;
      background: radial-gradient(circle, #777 0 18%, #b8bbb3 19% 34%, #444 35% 38%, #ddd 39%);
    }

    .ct-lightbox span:first-child { left: 14%; }
    .ct-lightbox span:last-child { right: 14%; }

    .monitor-art {
      right: 17%; top: 17%; width: 15%; height: 21%;
      border: 5px solid #26323a;
      background: #0e2220;
      box-shadow: 0 8px 0 rgba(0,0,0,0.24);
    }

    .monitor-line {
      position: absolute;
      left: 9%; right: 9%; top: 48%;
      height: 4px;
      background: linear-gradient(90deg, #78f0aa 0 18%, transparent 18% 24%, #78f0aa 24% 32%, transparent 32% 38%, #78f0aa 38% 100%);
    }

    .monitor-dot {
      position: absolute;
      right: 12%; bottom: 12%;
      width: 8px; height: 8px;
      background: #e4574f;
    }

    .phone-art {
      right: 5%; top: 16%; width: 7%; height: 9%;
      border-radius: 12px 12px 4px 4px;
      background: var(--ink);
      border: 3px solid var(--gold);
    }

    .bed-art {
      left: 37%; top: 43%; width: 30%; height: 31%;
      border-radius: 10px 24px 18px 12px;
      background: linear-gradient(180deg, #e8d9b5, #c69e68);
      box-shadow: inset 0 -18px 0 #6f3e3e, 0 14px 0 rgba(0,0,0,0.22);
    }

    .pillow {
      position: absolute;
      right: 12%; top: 8%;
      width: 28%; height: 30%;
      border-radius: 50% 35% 35% 50%;
      background: var(--paper);
    }

    .patient-head {
      position: absolute;
      right: 19%; top: 22%;
      width: 13%; height: 18%;
      border-radius: 50%;
      background: #b97958;
      box-shadow: inset -4px -2px 0 rgba(0,0,0,0.2);
    }

    .patient-body {
      position: absolute;
      left: 28%; top: 33%;
      width: 45%; height: 26%;
      border-radius: 18px;
      background: #456a8a;
    }

    .patient-arm {
      position: absolute;
      top: 38%;
      width: 26%; height: 7%;
      border-radius: 8px;
      background: #b97958;
    }

    .right-arm { right: 22%; transform: rotate(-10deg); }
    .left-arm { left: 25%; transform: rotate(17deg); filter: saturate(0.82); }

    .tray-art {
      left: 29%; top: 62%; width: 12%; height: 13%;
      border-radius: 8px;
      background: #8f9a99;
      border: 4px solid #3f4c50;
    }

    .plate {
      position: absolute;
      left: 16%; top: 20%;
      width: 64%; height: 58%;
      border-radius: 50%;
      background: #f5f0dd;
    }

    .sandwich {
      position: absolute;
      top: 34%;
      width: 26%; height: 25%;
      background: var(--gold);
      border: 2px solid #8b5a2b;
    }

    .right-half { right: 25%; clip-path: polygon(0 0, 100% 50%, 0 100%); }
    .left-half { left: 25%; opacity: 0.35; clip-path: polygon(100% 0, 0 50%, 100% 100%); }

    .cart-art {
      right: 15%; top: 52%; width: 12%; height: 24%;
      border: 4px solid #322432;
      background: #6b8391;
      box-shadow: 0 10px 0 rgba(0,0,0,0.22);
    }

    .cart-art span {
      display: block;
      height: 14%;
      margin: 11% 12%;
      background: #d8e0d2;
      border: 2px solid #34404a;
    }

    .cabinet-art {
      right: 3%; top: 35%; width: 11%; height: 39%;
      border: 5px solid #3a283a;
      background: linear-gradient(90deg, #82543f, #a36a51);
      box-shadow: inset 0 0 0 4px rgba(255,255,255,0.08);
    }

    .cabinet-art span {
      position: absolute;
      left: 16%; right: 16%;
      height: 3px;
      background: #2a1824;
    }

    .cabinet-art span:first-child { top: 35%; }
    .cabinet-art span:last-child { top: 65%; }

    .hotspot {
      position: absolute;
      z-index: 4;
      border: 2px solid transparent;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }

    .hotspot span {
      position: absolute;
      left: 50%; bottom: 100%;
      min-width: max-content;
      padding: 4px 7px;
      border: 2px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      font-family: var(--retro-font);
      font-size: 0.68rem;
      opacity: 0;
      transform: translateX(-50%) translateY(-4px);
      transition: opacity 120ms ease;
    }

    .hotspot:hover, .hotspot:focus-visible {
      border-color: rgba(247,237,207,0.8);
      outline: none;
      background: rgba(247,237,207,0.1);
    }

    .game-root.inventory-dragging .hotspot {
      border-color: rgba(215,170,68,0.54);
      background: rgba(247,237,207,0.08);
    }

    .game-root.inventory-dragging .hotspot.drop-target {
      border-color: #fff0b8;
      background: rgba(215,170,68,0.28);
      box-shadow: inset 0 0 0 2px rgba(33,25,35,0.75), 0 0 18px rgba(247,237,207,0.6);
    }

    .hotspot:hover span, .hotspot:focus-visible span { opacity: 1; }

    .case-rail {
      padding: 14px 10px;
      border-left: 4px solid #130b12;
      background: linear-gradient(180deg, #3a283a, var(--ink));
    }

    .case-rail h2, .inventory-panel h2 {
      margin: 0 0 5px;
      color: #f2ce77;
      font-family: var(--retro-font);
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    .case-file {
      width: 100%;
      margin-bottom: 8px;
      padding: 8px;
      border: 3px ridge var(--gold);
      background: var(--paper);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .case-file span {
      display: block;
      margin-top: 4px;
      color: var(--maroon);
      font-family: var(--retro-font);
      font-size: 0.66rem;
      text-transform: uppercase;
    }

    .case-file.locked { filter: saturate(0.65); opacity: 0.78; }

    .inventory-panel {
      border: 4px ridge var(--gold);
      background: var(--paper);
      color: var(--ink);
    }

    .help-button, .inventory-item, .primary-action, .option, .exam-card, .message-ok {
      border: 3px outset var(--gold);
      background: linear-gradient(180deg, #f6e2a6, #b98443);
      color: var(--ink);
      cursor: pointer;
    }

    .option.selected {
      border-style: inset;
      background: linear-gradient(180deg, #91d8c5, var(--teal));
      color: var(--paper);
    }

    .inventory-panel {
      min-height: 0;
      padding: clamp(7px, 1vh, 10px);
      overflow: hidden;
    }

    .inventory-list {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
      height: 36px;
      min-height: 36px;
      max-height: 36px;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    .inventory-list::-webkit-scrollbar { display: none; }

    .top-inventory .inventory-list { flex: 1 1 auto; }

    .inventory-item {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      max-width: 36px;
      max-height: 36px;
      flex: 0 0 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      border: 0;
      background: transparent;
      color: var(--paper);
      font-family: var(--retro-font);
      appearance: none;
      -webkit-appearance: none;
      touch-action: none;
      user-select: none;
    }

    .inventory-item > * { pointer-events: none; }

    .inventory-item:hover {
      filter: brightness(1.18) drop-shadow(0 0 4px rgba(255,225,117,0.72));
    }

    .inventory-item:focus-visible {
      outline: 2px dotted #ffe175;
      outline-offset: -3px;
    }

    .inventory-item.with-art {
      padding: 2px;
    }

    .inventory-item.with-symbol {
      padding: 3px;
    }

    .inventory-item-art {
      width: 28px;
      height: 32px;
      flex: 0 0 28px;
      border: 0;
      background: transparent;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .inventory-item-art[data-inventory-art="tuningFork"] {
      width: 13px;
      height: 32px;
      flex-basis: 13px;
      border: 0;
      background: transparent;
      transform: rotate(-34deg) scale(1.08);
    }

    .inventory-item-symbol {
      width: 30px;
      flex: 0 0 30px;
      font-family: var(--emoji-font);
      font-size: 1.42rem;
      line-height: 1;
      text-align: center;
    }

    .inventory-item.selected {
      border: 0;
      background: transparent;
      color: var(--paper);
      box-shadow: none;
      filter: brightness(1.24) drop-shadow(0 0 6px #ffe175);
    }

    .inventory-item.dragging {
      border: 0;
      background: transparent;
      opacity: 0.55;
    }

    .drag-ghost {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 120;
      display: none;
      max-width: 220px;
      padding: 6px 9px;
      border: 3px outset var(--gold);
      background: linear-gradient(180deg, #f6e2a6, #b98443);
      color: var(--ink);
      font-family: var(--retro-font);
      font-size: 0.72rem;
      line-height: 1.1;
      pointer-events: none;
      box-shadow: 0 10px 24px rgba(0,0,0,0.45);
      transform: translate(12px, 12px);
    }

    .drag-ghost.visible { display: block; }

    .drag-ghost.has-visual.visible {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 9px 4px 5px;
    }

    .drag-ghost-art {
      width: 30px;
      height: 42px;
      border: 2px inset rgba(92,31,49,0.58);
      background: #f7f1df;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .drag-ghost-art[data-inventory-art="tuningFork"] {
      width: 15px;
      height: 48px;
      border: 0;
      background: transparent;
    }

    .drag-ghost-symbol {
      width: 30px;
      flex: 0 0 30px;
      font-family: var(--emoji-font);
      font-size: 1.55rem;
      line-height: 1;
      text-align: center;
    }

    .game-root.inventory-dragging .emoji-cursor { display: none !important; }

    .message-popup {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 48px);
      background: rgba(15, 9, 18, 0.22);
    }

    .message-popup[hidden] { display: none; }

    .message-window {
      width: min(560px, calc(100vw - 36px));
      max-height: min(70dvh, 340px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      border: 5px ridge var(--gold);
      background:
        linear-gradient(90deg, rgba(255,232,172,0.2), transparent 12px, transparent calc(100% - 12px), rgba(255,232,172,0.2)),
        var(--paper);
      color: var(--ink);
      box-shadow:
        inset 0 0 0 2px #6f3b57,

    .wash-game {
      position: relative;
      width: calc(100% - 40px);
      max-width: min(740px, calc(52vh * 1456 / 1092));
      aspect-ratio: 1456 / 1092;
      margin: 14px auto 20px;
      border: 5px solid var(--ink);
      overflow: hidden;
      background: #596063 url("assets/handwash-sink.png") center / 100% 100% no-repeat;
      cursor: crosshair;
      image-rendering: pixelated;
      touch-action: none;
      user-select: none;
    }

    .wash-bubble {
      position: absolute;
      z-index: 2;
      left: var(--bubble-x);
      top: var(--bubble-y);
      width: var(--bubble-size);
      height: var(--bubble-size);
      border: 0;
      margin: 0;
      padding: 0;
      clip-path: polygon(
        25% 0, 75% 0, 75% 6.25%, 87.5% 6.25%, 87.5% 12.5%,
        93.75% 12.5%, 93.75% 25%, 100% 25%, 100% 75%, 93.75% 75%,
        93.75% 87.5%, 87.5% 87.5%, 87.5% 93.75%, 75% 93.75%, 75% 100%,
        25% 100%, 25% 93.75%, 12.5% 93.75%, 12.5% 87.5%, 6.25% 87.5%,
        6.25% 75%, 0 75%, 0 25%, 6.25% 25%, 6.25% 12.5%,
        12.5% 12.5%, 12.5% 6.25%, 25% 6.25%
      );
      background: rgba(243,255,252,0.92);
      filter: drop-shadow(3px 3px 0 rgba(31,65,65,0.38));
      transform: translate(-50%, -50%);
      transition: opacity 120ms steps(3), transform 120ms steps(3), filter 120ms steps(3);
      cursor: crosshair;
      appearance: none;
      -webkit-appearance: none;
      image-rendering: pixelated;
    }

    .wash-bubble::before {
      content: "";
      position: absolute;
      inset: 3px;
      background:
        linear-gradient(#ffffff, #ffffff) 22% 19% / 25% 12.5% no-repeat,
        linear-gradient(#ffffff, #ffffff) 16% 28% / 12.5% 25% no-repeat,
        linear-gradient(#8bcfc2, #8bcfc2) 69% 69% / 18.75% 18.75% no-repeat,
        linear-gradient(#b9eee3, #b9eee3) 75% 53% / 12.5% 12.5% no-repeat,
        linear-gradient(135deg, rgba(221,255,249,0.82) 0 49%, rgba(110,190,178,0.62) 50% 100%);
      opacity: 0.8;
      pointer-events: none;
    }

    .wash-bubble::after {
      content: "";
      position: absolute;
      left: 31.25%;
      top: 18.75%;
      width: 12.5%;
      height: 12.5%;
      background: #ffffff;
      box-shadow:
        4px 0 0 rgba(255,255,255,0.92),
        -2px 4px 0 rgba(255,255,255,0.72),
        13px 14px 0 rgba(44,130,120,0.36);
      pointer-events: none;
    }

    .wash-bubble.popped {
      opacity: 0;
      filter: blur(2px);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.16);
    }

    .wash-bubble:focus-visible {
      outline: 3px solid #fff3bf;
      outline-offset: 2px;
    }

    .wash-splat {
      position: absolute;
      z-index: 3;
      left: var(--splat-x);
      top: var(--splat-y);
      width: var(--splat-size);
      height: var(--splat-size);
      margin: 0;
      padding: 0;
      border: 0;
      clip-path: polygon(
        37.5% 6.25%, 56.25% 6.25%, 56.25% 12.5%, 68.75% 12.5%,
        68.75% 25%, 81.25% 25%, 81.25% 18.75%, 87.5% 18.75%,
        87.5% 37.5%, 100% 37.5%, 100% 56.25%, 87.5% 56.25%,
        87.5% 75%, 75% 75%, 75% 87.5%, 62.5% 87.5%,
        62.5% 100%, 43.75% 100%, 43.75% 87.5%, 25% 87.5%,
        25% 81.25%, 12.5% 81.25%, 12.5% 68.75%, 0 68.75%,
        0 50%, 12.5% 50%, 12.5% 31.25%, 25% 31.25%,
        25% 12.5%, 37.5% 12.5%
      );
      background: #4d1824;
      filter: drop-shadow(3px 3px 0 rgba(33,25,35,0.42));
      transform: translate(-50%, -50%) rotate(var(--splat-rotation));
      cursor: not-allowed;
      appearance: none;
      -webkit-appearance: none;
      image-rendering: pixelated;
    }

    .wash-splat::before {
      content: "";
      position: absolute;
      inset: 3px;
      background:
        linear-gradient(#ffd47a, #ffd47a) 24% 20% / 18.75% 12.5% no-repeat,
        linear-gradient(#c96349, #c96349) 63% 24% / 18.75% 18.75% no-repeat,
        linear-gradient(#5c1d2a, #5c1d2a) 68% 68% / 25% 25% no-repeat,
        linear-gradient(#793229, #793229) 27% 72% / 25% 18.75% no-repeat,
        linear-gradient(135deg, #b54d3d 0 49%, #7f2732 50% 100%);
      pointer-events: none;
    }

    .wash-splat::after {
      content: "";
      position: absolute;
      left: 37.5%;
      top: 37.5%;
      width: 12.5%;
      height: 12.5%;
      background: #e17a4b;
      box-shadow:
        4px 0 0 #8f2d34,
        0 4px 0 #6a202d,
        8px 4px 0 #d06043,
        -4px 8px 0 #7a2b2b;
      pointer-events: none;

    .wash-splat.hit {

    function midiBytesFromBase64(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    function readAscii(bytes, offset, length) {
      let text = "";
      for (let index = 0; index < length; index += 1) {
        text += String.fromCharCode(bytes[offset + index]);
      }
      return text;
    }

    function readUint16(bytes, offset) {
      return (bytes[offset] << 8) | bytes[offset + 1];
    }

    function readUint32(bytes, offset) {
      return ((bytes[offset] << 24) >>> 0) + (bytes[offset + 1] << 16) + (bytes[offset + 2] << 8) + bytes[offset + 3];
    }

    function readVariableLength(bytes, cursor) {
      let value = 0;
      while (cursor.position < bytes.length) {
        const byte = bytes[cursor.position];
        cursor.position += 1;
        value = (value << 7) | (byte & 0x7f);
        if ((byte & 0x80) === 0) break;
      }
      return value;
    }

    function parseMidi(base64) {
      const bytes = midiBytesFromBase64(base64);
      if (readAscii(bytes, 0, 4) !== "MThd") throw new Error("Missing MIDI header.");

      const headerLength = readUint32(bytes, 4);
      const trackCount = readUint16(bytes, 10);
      const division = readUint16(bytes, 12);
      if (division & 0x8000) throw new Error("SMPTE MIDI timing is not supported.");

      let offset = 8 + headerLength;
      const tempoEvents = [{ tick: 0, micros: 500000 }];
      const rawNotes = [];

      for (let trackIndex = 0; trackIndex < trackCount; trackIndex += 1) {
        if (readAscii(bytes, offset, 4) !== "MTrk") break;
        const trackLength = readUint32(bytes, offset + 4);
        const trackEnd = offset + 8 + trackLength;
        const cursor = { position: offset + 8 };
        const activeNotes = new Map();
        let tick = 0;
        let runningStatus = 0;

        while (cursor.position < trackEnd) {
          tick += readVariableLength(bytes, cursor);
          let status = bytes[cursor.position];
          cursor.position += 1;

          if (status < 0x80) {
            cursor.position -= 1;
            status = runningStatus;
          } else if (status < 0xf0) {
            runningStatus = status;
          }

          if (status === 0xff) {
            const metaType = bytes[cursor.position];
            cursor.position += 1;
            const length = readVariableLength(bytes, cursor);
            if (metaType === 0x51 && length === 3) {
              tempoEvents.push({
                tick,
                micros: (bytes[cursor.position] << 16) | (bytes[cursor.position + 1] << 8) | bytes[cursor.position + 2]
              });
            }
            cursor.position += length;
            continue;
          }

          if (status === 0xf0 || status === 0xf7) {
            cursor.position += readVariableLength(bytes, cursor);
            continue;
          }

          const eventType = status & 0xf0;
          const channel = status & 0x0f;
          const dataLength = eventType === 0xc0 || eventType === 0xd0 ? 1 : 2;
          const data1 = bytes[cursor.position];
          cursor.position += 1;
          const data2 = dataLength === 2 ? bytes[cursor.position] : 0;
          if (dataLength === 2) cursor.position += 1;

          if (eventType === 0x90 && data2 > 0) {
            const key = channel + ":" + data1;
            if (!activeNotes.has(key)) activeNotes.set(key, []);
            activeNotes.get(key).push({ tick, velocity: data2 / 127 });
          }

          if (eventType === 0x80 || (eventType === 0x90 && data2 === 0)) {
            const key = channel + ":" + data1;
            const stack = activeNotes.get(key);
            if (stack && stack.length) {
              const started = stack.shift();
              rawNotes.push({
                startTick: started.tick,
                endTick: tick,
                note: data1,
                channel,
                velocity: started.velocity
              });
            }
          }
        }

        offset = trackEnd;
      }

      tempoEvents.sort((left, right) => left.tick - right.tick);
      const tempos = [];
      tempoEvents.forEach(event => {
        const previous = tempos[tempos.length - 1];
        if (previous && previous.tick === event.tick) previous.micros = event.micros;
        else tempos.push({ ...event });
      });

      function tickToSeconds(targetTick) {
        let seconds = 0;
        let previousTick = 0;
        let micros = 500000;

        tempos.forEach(event => {
          if (event.tick <= previousTick) {
            micros = event.micros;
            return;
          }
          if (event.tick >= targetTick) return;
          seconds += ((event.tick - previousTick) * micros) / 1000000 / division;
          previousTick = event.tick;
          micros = event.micros;
        });

        return seconds + ((targetTick - previousTick) * micros) / 1000000 / division;
      }

      const notes = rawNotes
        .filter(note => note.endTick > note.startTick)
        .map(note => {
          const start = tickToSeconds(note.startTick);
          const end = tickToSeconds(note.endTick);
          return {
            start,
            duration: Math.max(0.05, end - start),
            midi: note.note,
            channel: note.channel,
            velocity: note.velocity
          };
        })
        .sort((left, right) => left.start - right.start);

      const loopDuration = Math.max(8, ...notes.map(note => note.start + note.duration)) + 0.75;
      return { notes, loopDuration };
    }

    function ensureMusicLoaded() {
      if (musicState.loaded) return true;

      try {

        musicState.notes = parsed.notes;
        musicState.loopDuration = parsed.loopDuration;
        musicState.loaded = true;

    function stopScheduledMusicSources() {

    function switchMusicTrack(trackId, forcePlay = false) {
      const shouldPlay = musicState.playing || forcePlay;
      clearInterval(musicState.timer);
      musicState.timer = null;
      stopScheduledMusicSources();
      if (musicState.master && musicState.context) {
        musicState.master.gain.setTargetAtTime(0, musicState.context.currentTime, 0.02);
      }
      musicState.playing = false;
      musicState.loaded = false;
      musicState.notes = [];
      musicState.nextNote = 0;
      musicState.trackId = trackId;

    function ensureAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        setMusicStatus("Web Audio is unavailable.");
        return false;
      }

      if (!musicState.context) {
        try {
          musicState.context = new AudioContextClass();
          musicState.master = musicState.context.createGain();
          musicState.master.gain.value = 0;
          musicState.master.connect(musicState.context.destination);
          musicState.sfxMaster = musicState.context.createGain();
          musicState.sfxMaster.gain.value = sfxGainValue();
          musicState.sfxMaster.connect(musicState.context.destination);
        } catch (error) {
          setMusicStatus("Web Audio is unavailable.");
          return false;
        }
      }

      if (!musicState.sfxMaster) {
        musicState.sfxMaster = musicState.context.createGain();
        musicState.sfxMaster.gain.value = sfxGainValue();
        musicState.sfxMaster.connect(musicState.context.destination);
      }

      return true;
    }

    function scheduleSfxTone(frequency, when, duration, volume, type = "triangle") {
      const context = musicState.context;
      if (!context || !musicState.sfxMaster) return;
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      const end = when + duration;

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, when);
      gain.gain.setValueAtTime(0.0001, when);
      gain.gain.exponentialRampToValueAtTime(volume, when + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, end);
      oscillator.connect(gain);
      gain.connect(musicState.sfxMaster);
      oscillator.start(when);
      oscillator.stop(end + 0.02);
    }

    function scheduleSfxPattern(kind) {
      const context = musicState.context;
      if (!context || !musicState.sfxMaster || state.sfxVolume <= 0) return;
      const now = context.currentTime;

      if (kind === "success") {
        if (now - musicState.lastSuccessSound < 0.14) return;
        musicState.lastSuccessSound = now;
        scheduleSfxTone(523.25, now + 0.005, 0.1, 0.24);
        scheduleSfxTone(659.25, now + 0.1, 0.11, 0.22);
        scheduleSfxTone(783.99, now + 0.205, 0.12, 0.2);
        return;
      }

      scheduleSfxTone(360, now + 0.003, 0.06, 0.18, "square");
      scheduleSfxTone(520, now + 0.032, 0.05, 0.12, "triangle");
    }

    function playSfx(kind) {
      if (!ensureAudioContext()) return;
      const context = musicState.context;
      if (context.state === "suspended") {
        context.resume()
          .then(() => scheduleSfxPattern(kind))
          .catch(() => {});
        return;
      }
      scheduleSfxPattern(kind);
    }

    function noteFrequency(midiNote) {
      return 440 * Math.pow(2, (midiNote - 69) / 12);
    }

    function scheduleSynthNote(note, when) {
      const context = musicState.context;
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      const duration = Math.min(note.duration, 3.5);
      const end = when + duration;
      const attack = 0.008;
      const release = Math.min(0.08, duration / 2);
      const amplitude = Math.min(0.12, 0.025 + note.velocity * 0.08);
      const waveforms = ["square", "triangle", "sine", "sawtooth"];

      oscillator.type = note.channel === 9 ? "square" : waveforms[note.channel % waveforms.length];
      oscillator.frequency.setValueAtTime(noteFrequency(note.midi), when);
      gain.gain.setValueAtTime(0, when);
      gain.gain.linearRampToValueAtTime(amplitude, when + attack);
      gain.gain.setValueAtTime(amplitude, Math.max(when + attack, end - release));
      gain.gain.linearRampToValueAtTime(0, end);

      oscillator.connect(gain);
      gain.connect(musicState.master);
      musicState.scheduledSources.push(oscillator);
      oscillator.addEventListener("ended", () => {
        musicState.scheduledSources = musicState.scheduledSources.filter(source => source !== oscillator);
      }, { once: true });
      oscillator.start(when);
      oscillator.stop(end + 0.05);
    }

    function scheduleMusic() {
      if (!musicState.playing || !musicState.context || !musicState.notes.length) return;
      const context = musicState.context;
      const now = context.currentTime;
      const lookAhead = 0.8;

      while (musicState.loopStart + musicState.loopDuration < now - 0.05) {
        musicState.loopStart += musicState.loopDuration;
        musicState.nextNote = 0;
      }

      while (musicState.nextNote < musicState.notes.length) {
        const note = musicState.notes[musicState.nextNote];
        const when = musicState.loopStart + note.start;
        if (when > now + lookAhead) break;
        if (when + note.duration > now) scheduleSynthNote(note, when);
        musicState.nextNote += 1;
      }

      if (musicState.nextNote >= musicState.notes.length && musicState.loopStart + musicState.loopDuration < now + lookAhead) {
        musicState.loopStart += musicState.loopDuration;
        musicState.nextNote = 0;
      }
    }

    async function startMusic() {
      if (!ensureMusicLoaded()) return;
      setMusicStatus("Starting music...");
      if (!ensureAudioContext()) return;
      try {
        const resumeAttempt = musicState.context.state === "suspended"
          ? musicState.context.resume()
          : Promise.resolve();
        musicState.playing = true;
        musicState.loopStart = musicState.context.currentTime + 0.08;
        musicState.nextNote = 0;
        setMusicVolume(state.musicVolume);
        clearInterval(musicState.timer);
        musicState.timer = setInterval(scheduleMusic, 120);
        scheduleMusic();
        setMusicStatus("Music playing.");
        updateMusicUi();
        resumeAttempt.catch(() => {
          if (musicState.playing) setMusicStatus("Browser blocked audio. Click START MUSIC again.");
        });
      } catch (error) {
        musicState.playing = false;
        setMusicStatus("Browser blocked audio. Click START MUSIC again.");
        updateMusicUi();
      }
    }

    function stopMusic() {
      musicState.playing = false;
      clearInterval(musicState.timer);
      musicState.timer = null;
      stopScheduledMusicSources();
      if (musicState.master && musicState.context) {
        musicState.master.gain.setTargetAtTime(0, musicState.context.currentTime, 0.03);
      }
      setMusicStatus("Music paused.");
      updateMusicUi();
    }

    function toggleMusic() {
      if (musicState.playing) stopMusic();
      else startMusic();
    }

    function shuffledCartQuestions() {
      const questions = cartQuestionBank.slice();
      for (let index = questions.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [questions[index], questions[swapIndex]] = [questions[swapIndex], questions[index]];
      }
      return questions;
    }

    function cartConsoleMarkup(session, statusText, statusClass) {
      const codeSlots = Array.from({ length: 5 }, (_, index) => {
        const digit = session.code[index];
        return `<span class="cart-led-digit${digit ? " lit" : ""}">${digit || "-"}</span>`;
      }).join("");
      const strikeLights = Array.from({ length: 3 }, (_, index) => (
        `<span class="cart-strike-light${index < session.mistakes ? " hit" : ""}"></span>`
      )).join("");

      return `
        <div class="cart-console" aria-label="Exam cart access console">
          <div>
            <span class="cart-console-label">Neuro-Safe RX Cart / Access Code</span>
            <div class="cart-led-readout" aria-label="${session.code.length} of 5 code digits entered">${codeSlots}</div>
            <div class="cart-console-status ${statusClass || ""}" aria-live="polite">${escapeHtml(statusText)}</div>
          </div>
          <div class="cart-strikes">
            <strong>Errors ${session.mistakes} / 3</strong>
            <div class="cart-strike-lights" aria-label="${session.mistakes} of 3 errors">${strikeLights}</div>
          </div>
        </div>
      `;
    }

    function openCartQuiz() {
      const session = {
        questions: shuffledCartQuestions(),
        questionIndex: 0,
        correct: 0,
        mistakes: 0,
        code: [],
        locked: false
      };

      openModal(`
        <section class="modal-card cart-quiz-card" id="cartQuiz" role="dialog" aria-modal="true" aria-labelledby="cartQuizTitle">
          <div class="modal-header"><h2 id="cartQuizTitle">Exam Cart: Neuro Rapid-Fire Lock</h2><button type="button" data-close aria-label="Close">X</button></div>
          <div class="cart-quiz-body" id="cartQuizBody"></div>
        </section>
      `);

      setMinigameAutowin(() => completeCartQuiz("00000"));

      const quizCard = document.getElementById("cartQuiz");
      const quizBody = document.getElementById("cartQuizBody");

      function renderQuestion(result) {
        const question = session.questions[session.questionIndex];
        const answeredIndex = result ? result.answeredIndex : null;
        const statusText = result
          ? result.status
          : "Choose 1-5. Five correct digits unlock the cart.";
        const statusClass = result ? result.statusClass : "";

        quizBody.innerHTML = `
          ${cartConsoleMarkup(session, statusText, statusClass)}
          <div class="cart-question-meta">
            <span>${result ? "Correct " + session.correct + " of 5" : "Digit " + (session.correct + 1) + " of 5"} / Bank question ${session.questionIndex + 1}</span>
            <span class="cart-difficulty">${escapeHtml(question.difficulty)}</span>
          </div>
          <p class="cart-question">${escapeHtml(question.prompt)}</p>
          <div class="cart-answer-grid">
            ${question.options.map((option, index) => {
              let resultClass = "";
              if (result && index === question.answer) resultClass = " correct-answer";
              else if (result && index === answeredIndex) resultClass = " wrong-answer";
              return `<button type="button" class="cart-answer${resultClass}" data-cart-answer="${index}"${result ? " disabled" : ""}>
                <span class="cart-answer-number">${index + 1}</span>
                <span class="cart-answer-text">${escapeHtml(option)}</span>
              </button>`;
            }).join("")}
          </div>
          ${result ? `<div class="cart-feedback-actions">
            <p class="cart-feedback ${result.correct ? "" : "error"}">${escapeHtml(result.feedback)}</p>
            <button type="button" class="primary-action" id="cartAdvance">${escapeHtml(result.advanceLabel)}</button>
          </div>` : ""}
        `;

        if (!result) {
          quizBody.querySelectorAll("[data-cart-answer]").forEach(button => {
            button.addEventListener("click", () => answerQuestion(Number(button.dataset.cartAnswer)));
          });
          const firstAnswer = quizBody.querySelector("[data-cart-answer]");
          if (firstAnswer) firstAnswer.focus();
        } else {
          const advanceButton = document.getElementById("cartAdvance");
          advanceButton.addEventListener("click", () => advanceAfterFeedback(result, question));
          advanceButton.focus();
        }
      }

      function advanceAfterFeedback(result, question) {
        if (result.advanceAction === "complete") {
          completeCartQuiz(session.code.join(""));
          return;
        }
        if (result.advanceAction === "lockout") {
          renderFailure(question.explanation);
          return;
        }
        session.questionIndex += 1;
        session.locked = false;
        renderQuestion();
      }

      function renderFailure(lastExplanation) {
        session.code = [];
        session.correct = 0;
        quizBody.innerHTML = `
          ${cartConsoleMarkup(session, "ERROR 3: ACCESS CODE CLEARED", "error")}
          <section class="cart-failure">
            <h3>LOCKOUT</h3>
            <p>${escapeHtml(lastExplanation)} Three errors cleared the code. Restart for a newly shuffled set of questions.</p>
            <button type="button" class="primary-action" id="restartCartQuiz">Restart Quiz</button>
          </section>
        `;
        document.getElementById("restartCartQuiz").addEventListener("click", restartQuiz);
        document.getElementById("restartCartQuiz").focus();
      }

      function restartQuiz() {
        session.questions = shuffledCartQuestions();
        session.questionIndex = 0;
        session.correct = 0;
        session.mistakes = 0;
        session.code = [];
        session.locked = false;
        renderQuestion();
      }

      function answerQuestion(answerIndex) {
        if (session.locked) return;
        session.locked = true;
        const question = session.questions[session.questionIndex];
        const isCorrect = answerIndex === question.answer;

        if (isCorrect) {
          session.correct += 1;
          session.code.push(answerIndex + 1);
          playSfx("success");
          const completesCode = session.correct === 5;
          renderQuestion({
            answeredIndex: answerIndex,
            correct: true,
            status: "DIGIT " + (answerIndex + 1) + " ACCEPTED",
            statusClass: "accepted",
            feedback: "Correct. " + question.explanation,
            advanceAction: completesCode ? "complete" : "next",
            advanceLabel: completesCode ? "Unlock Cart" : "Next Question"
          });
        } else {
          session.mistakes += 1;
          const triggersLockout = session.mistakes >= 3;
          renderQuestion({
            answeredIndex: answerIndex,
            correct: false,
            status: "ERROR " + session.mistakes + " OF 3",
            statusClass: "error",
            feedback: "Incorrect. " + question.explanation,
            advanceAction: triggersLockout ? "lockout" : "next",
            advanceLabel: triggersLockout ? "Continue to Lockout" : "Next Question"
          });
        }
      }

      quizCard.addEventListener("keydown", event => {
        if (session.locked || !/^[1-5]$/.test(event.key)) return;
        const answerButton = quizBody.querySelector(`[data-cart-answer="${Number(event.key) - 1}"]`);
        if (!answerButton) return;
        event.preventDefault();
        answerButton.click();
      });

      renderQuestion();
    }

        if (has(state.inventory, "patientPhone")) {

          return;
        }
        setMessage("The bedside phone battery is dead. Check the patient belongings for a charger.");
        return;
      }
      if (id === "belongings") {
        addInventory("phoneCharger");
        setMessage("You find a phone charger in the patient's bag.");
        return;
      }
      if (id === "sink") {
        washHands();
        return;
      }
      if (id === "drawer") {
        if (has(state.completed, "safetyPinFound")) {
          setMessage(has(state.findings, "spinothalamic")
            ? "The safety pin has already been used for the completed sensory examination."
            : "The safety pin is already in inventory.");

        }
        markCompleted("safetyPinFound");
        addInventory("safetyPin");
        setMessage("You open the supply drawer and take a clean safety pin for careful pinprick comparison.");
        return;
      }
      if (id === "fridge") {
        if (has(state.completed, "icePackFound")) {
          setMessage(has(state.findings, "spinothalamic")
            ? "The ice pack has already been used for the completed sensory examination."
            : "The ice pack is already in inventory.");
          return;
        }
        markCompleted("icePackFound");
        addInventory("icePack");
        setMessage("You open the refrigerator and take a wrapped ice pack for temperature testing.");
        return;
      }
      if (id === "cart") {
        if (!has(state.completed, "examTools")) {
          openCartQuiz();
          return;
        }
        addInventory("hammer");
        addInventory("tuningFork");
        markCompleted("outletRevealed");
        setMessage("You collect the reflex hammer and tuning fork. A power outlet is mounted on the side of the cart.");
        return;
      }
      if (id === "monitor") {
        addFinding("vitals");
        setMessage("T 36.8 C, BP 128/76 mm Hg, HR 72/min, RR 18/min, SpO2 98% on room air.");
        return;
      }
      if (id === "cabinet") {
        if (!has(state.completed, "soapRefillFound")) {
          markCompleted("soapRefillFound");
          addInventory("soapRefill");
          setMessage("You find a soap refill behind the cotton jars.");
          return;
        }
        setMessage("The upper cabinet contains routine supplies. The soap refill was the needed item here.");

      if (id === "ct") {

        return;

      if (id === "phone") {

          setMessage("You lift the wall phone, but the attending requests a confirmed imaging diagnosis before the big call.");
          return;

        setMessage("You present the final diagnosis and disposition. Case 01 is complete.");

      if (id === "door") {
        setMessage("The ward door is locked. Future specialty rooms are not available yet.");
      }
    }

    function handleInventoryUse(itemId, hotspotId) {
      if (!itemId || !has(state.inventory, itemId)) return;

      if (itemId === "stethoscope" && hotspotId === "patient") {
        requestPhysicalExam();
        return;
      }

      if (hotspotId === "door") {
        setMessage("Using " + inventoryName(itemId) + " on the ward door has no effect. Future specialty rooms are not available yet.");
        return;
      }

      if (hotspotId === "phone") {
        if (finalReady()) {
          setMessage("You bring the confirmed diagnosis to the attending phone. Case 01 is complete.");
        } else {
          setMessage("The attending wants a confirmed diagnosis from the imaging report first.");
        }
        return;
      }

      if (itemId === "soapRefill") {
        if (hotspotId === "sink") {
          installSoapRefill();
          removeInventory(itemId);
          return;
        }
        if (hotspotId === "patient") {
          setMessage("The patient declines to be examined with a soap cartridge. Try the sink.");
          return;
        }
      }

      if (itemId === "phoneCharger") {
        if (hotspotId === "cart") {
          if (!has(state.completed, "outletRevealed")) {
            markCompleted("outletRevealed");
            setMessage("You plug the charger into the outlet on the side of the cart. Connect the other end to the phone.");
            return;
          }
          markCompleted("phoneCharged");
          addInventory("patientPhone");
          removeInventory(itemId);
          setMessage("You route the charger from the outlet to the bedside phone. The phone powers on; its walking video is ready to review with the patient.");
          return;
        }
        if (hotspotId === "bedsideTable") {
          if (!has(state.completed, "outletRevealed")) {
            setMessage("The charger fits the phone, but it still needs power. Plug it into the outlet on the side of the exam cart first.");
            return;
          }
          markCompleted("phoneCharged");
          addInventory("patientPhone");
          removeInventory(itemId);
          setMessage("You connect the charger to the bedside phone. Its walking video is ready to review with the patient.");
          return;
        }
      }

      if (itemId === "patientPhone") {
        if (hotspotId === "patient") {
          addFinding("collateralPhone");
          addFinding("motorWeakness");
          markCompleted("videoMotorAssessment");
          removeInventory(itemId);
          setMessage("You review the walking video with the patient. It shows a left stiff-legged gait with foot drag, providing functional evidence of an upper motor neuron pattern when formal graded power is limited by pain and guarding.");
          return;
        }
      }

      if (itemId === "hammer") {
        if (hotspotId === "patient") {
          if (!requireHandHygiene()) return;
          runNeurologicExam("reflex");
          return;
        }
        if (hotspotId === "cabinet") {
          setMessage("Use the reflex hammer on the patient, not the cabinet.");
          return;
        }
      }

      if (itemId === "tuningFork") {
        if (hotspotId === "patient") {
          if (!requireHandHygiene()) return;
          openSensoryGame();
          return;
        }
      }

      if (itemId === "safetyPin" || itemId === "icePack") {
        if (hotspotId === "patient") {
          if (!requireHandHygiene()) return;
          openSensoryGame();
          return;
        }
      }

      if (itemId === "icePack") {
        if (hotspotId === "sink") {
          setMessage("The ice pack is already prepared as a wrapped cold stimulus; use it on the patient during sensory testing.");
          return;
        }
      }

      if (hotspotId === "ct") {
        setMessage("Inventory items are not needed at the workstation. Select HAND or THINK and click the computer.");
        return;
      }

      genericInventoryUse(itemId, hotspotId);
    }

    function setInventoryDragTarget(target) {
      if (inventoryDrag.target === target) return;
      if (inventoryDrag.target) inventoryDrag.target.classList.remove("drop-target");
      inventoryDrag.target = target;
      if (inventoryDrag.target) inventoryDrag.target.classList.add("drop-target");
    }

    function hotspotFromPoint(x, y) {
      const element = document.elementFromPoint(x, y);
      return element ? element.closest("[data-hotspot]") : null;
    }

    function positionDragGhost(x, y) {
      const ghost = document.getElementById("dragGhost");
      ghost.style.left = x + "px";
      ghost.style.top = y + "px";
    }

    function startInventoryDragVisuals(itemId, source, x, y) {
      clearSelectedInventory();
      inventoryDrag.active = true;
      inventoryDrag.itemId = itemId;
      inventoryDrag.source = source;
      source.classList.add("dragging");
      document.querySelector(".game-root").classList.add("inventory-dragging");
      const ghost = document.getElementById("dragGhost");
      ghost.replaceChildren();
      ghost.classList.add("has-visual");
      const label = document.createElement("span");
      label.textContent = inventoryName(itemId);
      ghost.append(createInventoryVisual(itemId, "drag-ghost"), label);
      ghost.classList.add("visible");
      positionDragGhost(x, y);
    }

    function clearInventoryDragVisuals() {
      document.querySelector(".game-root").classList.remove("inventory-dragging");
      document.querySelectorAll(".inventory-item.dragging").forEach(item => item.classList.remove("dragging"));
      document.querySelectorAll(".hotspot.drop-target").forEach(item => item.classList.remove("drop-target"));
      const ghost = document.getElementById("dragGhost");
      ghost.classList.remove("visible");
      ghost.classList.remove("has-visual");
      ghost.replaceChildren();
      inventoryDrag.target = null;
    }

    function resetInventoryPointerDrag() {
      inventoryDrag.itemId = "";
      inventoryDrag.pointerId = null;
      inventoryDrag.source = null;
      inventoryDrag.startX = 0;
      inventoryDrag.startY = 0;
      inventoryDrag.active = false;
    }

    function beginInventoryPointer(event, itemId, source) {
      if (event.button !== undefined && event.button !== 0) return;
      inventoryDrag.itemId = itemId;
      inventoryDrag.pointerId = event.pointerId;
      inventoryDrag.source = source;
      inventoryDrag.startX = event.clientX;
      inventoryDrag.startY = event.clientY;
      inventoryDrag.active = false;
      source.setPointerCapture?.(event.pointerId);
      document.addEventListener("pointermove", moveInventoryPointer, { passive: false });
      document.addEventListener("pointerup", endInventoryPointer, { passive: false });
      document.addEventListener("pointercancel", cancelInventoryPointer, { passive: false });
    }

    function moveInventoryPointer(event) {
      if (event.pointerId !== inventoryDrag.pointerId || !inventoryDrag.itemId) return;
      const distance = Math.hypot(event.clientX - inventoryDrag.startX, event.clientY - inventoryDrag.startY);
      if (!inventoryDrag.active && distance < 6) return;
      event.preventDefault();
      if (!inventoryDrag.active) {
        startInventoryDragVisuals(inventoryDrag.itemId, inventoryDrag.source, event.clientX, event.clientY);
      }
      positionDragGhost(event.clientX, event.clientY);
      setInventoryDragTarget(hotspotFromPoint(event.clientX, event.clientY));
    }

    function endInventoryPointer(event) {
      if (event.pointerId !== inventoryDrag.pointerId) return;
      document.removeEventListener("pointermove", moveInventoryPointer);
      document.removeEventListener("pointerup", endInventoryPointer);
      document.removeEventListener("pointercancel", cancelInventoryPointer);
      const itemId = inventoryDrag.itemId;
      const target = inventoryDrag.active ? hotspotFromPoint(event.clientX, event.clientY) : null;
      if (inventoryDrag.active) {
        event.preventDefault();
        inventoryDrag.suppressClick = true;
        setTimeout(() => { inventoryDrag.suppressClick = false; }, 0);
        clearInventoryDragVisuals();
        if (target) handleInventoryUse(itemId, target.dataset.hotspot);
        else setMessage("You keep " + inventoryName(itemId) + " in the inventory shelf.");
      }
      resetInventoryPointerDrag();
    }

    function cancelInventoryPointer() {
      document.removeEventListener("pointermove", moveInventoryPointer);
      document.removeEventListener("pointerup", endInventoryPointer);
      document.removeEventListener("pointercancel", cancelInventoryPointer);
      clearInventoryDragVisuals();
      resetInventoryPointerDrag();
    }

    function beginNativeInventoryDrag(event, itemId, source) {
      inventoryDrag.itemId = itemId;
      inventoryDrag.source = source;
      inventoryDrag.suppressClick = true;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", itemId);
      startInventoryDragVisuals(itemId, source, event.clientX || inventoryDrag.startX, event.clientY || inventoryDrag.startY);
      setTimeout(() => { inventoryDrag.suppressClick = false; }, 0);
    }

    function handleHotspot(id) {
      if (state.selectedInventoryId) {
        const itemId = state.selectedInventoryId;
        clearSelectedInventory();
        handleInventoryUse(itemId, id);
        return;
      }

      if (state.mode === "grab" || state.mode === "think") {
        handleAction(id);
        return;
      }

      if (id === "patient") {
        if (state.mode === "talk") {
          openPatientHistory();
          return;
        }
        setMessage("The patient sits upright in bed, alert and watchful. The blanket is slightly rumpled around her left foot.");
        return;
      }

      if (id === "bedsideTable") {
        if (has(state.findings, "motorWeakness")) {
          setMessage("The walking video has been reviewed. Its functional motor findings are available in Chart Review.");
          return;
        }
        if (has(state.inventory, "patientPhone")) {
          setMessage("The charged phone contains the walking video. Drag it from inventory onto the patient to interpret the motor pattern.");
          return;
        }
        if (state.mode === "talk") {
          setMessage(has(state.completed, "phoneCharged")
            ? "The walking video is ready to review with the patient."
            : "The bedside table holds a phone with a dead battery.");
          return;
        }
        setMessage(has(state.completed, "phoneCharged")
          ? "The charged phone is ready for walking-video review."
          : "An uncharged patient phone is on the bedside table. It may contain useful collateral history.");
        return;
      }

      if (id === "belongings") {
        if (state.mode === "talk") {
          setMessage("The patient says, \"My charger might be in there.\"");
          return;
        }
        setMessage("A coat and leather bag sit on the chair. Select HAND or THINK to search them for the phone charger.");
        return;
      }

      if (id === "sink") {
        if (state.mode === "talk") {
          setMessage("Use the sink for hand hygiene before the exam.");
          return;
        }
        washHands();
        return;
      }

      if (id === "drawer") {
        if (has(state.completed, "safetyPinFound")) {
          setMessage(has(state.findings, "spinothalamic")
            ? "The pinprick portion of the sensory examination is complete."
            : "The clean safety pin from this drawer is in inventory.");
          return;
        }
        setMessage("The under-counter supply drawer may contain a pinprick tool. Select HAND or THINK to open it.");
        return;
      }

      if (id === "fridge") {
        if (has(state.completed, "icePackFound")) {
          setMessage(has(state.findings, "spinothalamic")
            ? "The temperature portion of the sensory examination is complete."
            : "The wrapped ice pack from this refrigerator is in inventory.");
          return;
        }
        setMessage("A small clinical refrigerator sits beneath the counter. Select HAND or THINK to open it.");
        return;
      }

      if (id === "cart") {
        setMessage("The exam cart has tools inside, a rapid-fire quiz lock on its screen, and a power outlet mounted on its side. Use HAND or THINK to operate it.");
        return;
      }

      if (id === "monitor") {
        addFinding("vitals");
        setMessage("T 36.8 C, BP 128/76 mm Hg, HR 72/min, RR 18/min, SpO2 98% on room air.");
        return;
      }

      if (id === "cabinet") {
        if (!has(state.completed, "soapRefillFound")) {
          setMessage("The cabinet contains supply jars. Use HAND or THINK to search for the soap refill.");
          return;
        }
        setMessage("The upper cabinet contains routine supplies, but no additional case-relevant equipment.");
        return;
      }

      if (id === "ct") {
        setMessage(has(state.completed, "ehrUpdateComplete")
          ? "The EHR update is complete. Use HAND or THINK on the computer to review the case and access imaging."
          : "The computer displays an EHR system update. Imaging software will not load yet.");
        return;
      }

      if (id === "phone") {
        if (!finalReady()) {
          setMessage("The attending says over the wall phone: 'Bring me the confirmed diagnosis from the imaging report.'");
          return;
        }
        setMessage("You present the final diagnosis and disposition. Case 01 is complete.");
        return;
      }

      if (id === "door") {
        setMessage("Future specialty rooms are not available yet.");
      }
    }

    function physicalExamActionKey(actionId) {
      return "physicalExam:" + actionId;
    }

    function physicalExamSystemDone(system) {
      if (system.id === "neurologic") {
        return pertinentNeurologicExamComplete();
      }
      return system.actions.every(actionId => has(state.completed, physicalExamActionKey(actionId)));
    }

    function neurologicExamDone(examId) {
      if (examId === "mentalStatus") return has(state.findings, "mentalStatus");
      if (examId === "cranialNerves") return has(state.findings, "cranialNerves");
      if (examId === "motor") return has(state.findings, "motorWeakness");
      if (examId === "sensory") return ["lightTouch", "dorsalColumn", "spinothalamic"].every(id => has(state.findings, id));
      if (examId === "reflex") return has(state.findings, "reflexes");
      if (examId === "coordination") return has(state.findings, "coordination");
      if (examId === "gait") return has(state.findings, "collateralPhone");
      if (examId === "sensoryLevel") return has(state.findings, "sensoryLevel");
      if (examId === "localization") return has(state.findings, "localization");
      return false;
    }

    function openExam(systemId) {
      const system = physicalExamSystems.find(item => item.id === systemId) || null;
      const neurologicActions = [
        ["mentalStatus", "Mental Status", "Attention, orientation, language, and behavior."],
        ["cranialNerves", "Cranial Nerves", "Focused examination of cranial nerves II-XII."],
        ["motor", "Motor Exam", "Interpret functional motor evidence from the walking video."],
        ["sensory", "Sensory Exam", "Complete the five-modality sensory testing game."],
        ["reflex", "Reflexes", "Test the patellar reflex with the timing game."],
        ["coordination", "Coordination", "Complete the four-target appendicular timing sequence."],
        ["gait", "Gait", "Review the recorded gait because walking at bedside is unsafe."]
      ];

      let panelMarkup;
      if (!system) {
        panelMarkup = `
          <div class="physical-exam-heading"><h3>Examination Systems</h3></div>
          <p class="physical-exam-intro">Choose a system for a focused physical examination.</p>
          <div class="exam-system-grid">
            ${physicalExamSystems.map(item => `
              <button type="button" class="exam-system-button${physicalExamSystemDone(item) ? " done" : ""}" data-exam-system="${item.id}">
                <strong>${escapeHtml(item.label)}</strong>
                <span>${escapeHtml(item.detail)}</span>
              </button>
            `).join("")}
          </div>
        `;
      } else if (system.id === "neurologic") {
        panelMarkup = `
          <div class="physical-exam-heading">
            <button type="button" class="exam-menu-back" data-exam-back aria-label="Back to examination systems" title="Back to systems">&#8592;</button>
            <h3>Neurologic Examination</h3>
          </div>
          <p class="physical-exam-intro">${escapeHtml(system.intro)}</p>
          <div class="neuro-exam-grid">
            ${neurologicActions.map(([id, label, detail]) => `
              <button type="button" class="exam-action-button${neurologicExamDone(id) ? " done" : ""}" data-neuro-exam="${id}">
                <strong>${escapeHtml(label)}</strong>
                <span>${escapeHtml(detail)}</span>
              </button>
            `).join("")}
          </div>
        `;
      } else {
        panelMarkup = `
          <div class="physical-exam-heading">
            <button type="button" class="exam-menu-back" data-exam-back aria-label="Back to examination systems" title="Back to systems">&#8592;</button>
            <h3>${escapeHtml(system.label)} Examination</h3>
          </div>
          <p class="physical-exam-intro">${escapeHtml(system.intro)}</p>
          <div class="exam-system-grid">
            ${system.actions.map(actionId => {
              const action = physicalExamActions[actionId];
              const done = has(state.completed, physicalExamActionKey(actionId));
              return `
                <button type="button" class="exam-action-button${done ? " done" : ""}" data-general-exam="${actionId}">
                  <strong>${escapeHtml(action.label)}</strong>
                  <span>${escapeHtml(action.detail)}</span>
                </button>
              `;
            }).join("")}
          </div>
        `;
      }

      openModal(`
        <section class="modal-card physical-exam-card" role="dialog" aria-modal="true" aria-labelledby="physicalExamTitle">
          <div class="modal-header"><h2 id="physicalExamTitle">Physical Examination</h2><button type="button" data-close aria-label="Close">X</button></div>
          <div class="physical-exam-layout">
            <div class="physical-exam-portrait"><img src="assets/patient-portrait.png" alt="Portrait of the patient"></div>
            <section class="physical-exam-panel">${panelMarkup}</section>
          </div>
        </section>
      `);

      document.querySelectorAll("[data-exam-system]").forEach(button => {
        button.addEventListener("click", () => openExam(button.dataset.examSystem));
      });
      document.querySelectorAll("[data-exam-back]").forEach(button => {
        button.addEventListener("click", () => openExam());
      });
      document.querySelectorAll("[data-general-exam]").forEach(button => {
        button.addEventListener("click", () => runPhysicalExamAction(system.id, button.dataset.generalExam, button));
      });
      document.querySelectorAll("[data-neuro-exam]").forEach(button => {
        button.addEventListener("click", () => runNeurologicExam(button.dataset.neuroExam, button));
      });

      const firstControl = document.querySelector("[data-exam-system], [data-exam-back]");
      if (firstControl) firstControl.focus();
    }

    function recordPhysicalExamAction(systemId, actionId) {
      const system = physicalExamSystems.find(item => item.id === systemId);
      const action = physicalExamActions[actionId];
      if (!system || !action || !system.actions.includes(actionId)) return null;

      const completionId = physicalExamActionKey(actionId);
      if (!has(state.completed, completionId)) {
        markCompleted(completionId);
        logAction("Examined " + system.label + ": " + action.label);
      }

      const systemComplete = system.actions.every(id => has(state.completed, physicalExamActionKey(id)));
      if (systemComplete && system.findingId) addFinding(system.findingId);
      return { system, action, systemComplete };
    }

    function runPhysicalExamAction(systemId, actionId, button) {
      if (!requireHandHygiene()) {
        closeModal();
        return;
      }
      const system = physicalExamSystems.find(item => item.id === systemId);
      const action = physicalExamActions[actionId];
      if (!system || !action || !system.actions.includes(actionId)) return;

      if (!has(state.completed, physicalExamActionKey(actionId))) {
        if (actionId === "respiratoryEffort") {
          launchPhysicalExamMinigame(systemId, openPulmonaryExpansionGame);
          return;
        }
        if (actionId === "abdominalInspection") {
          launchPhysicalExamMinigame(systemId, openAbdominalInspectionGame);
          return;
        }
        if (actionId === "pupils") {
          launchPhysicalExamMinigame(systemId, openPupilInspectionGame);
          return;
        }
        if (actionId === "earsNose") {
          launchPhysicalExamMinigame(systemId, openEarNoseInspectionGame);
          return;
        }
        if (actionId === "cardiacAuscultation") {
          launchPhysicalExamMinigame(systemId, openCardiacAuscultationGame);
          return;
        }
        if (actionId === "lungAuscultation") {
          launchPhysicalExamMinigame(systemId, openLungAuscultationGame);
          return;
        }
      }

      const recorded = recordPhysicalExamAction(systemId, actionId);
      if (!recorded) return;
      if (button) button.classList.add("done");
      setMessage(recorded.action.result + (recorded.systemComplete ? " " + recorded.system.label + " examination complete." : ""));
    }

    function openPulmonaryExpansionGame() {
      const canvasWidth = 840;
      const canvasHeight = 480;
      const respiratoryRate = Math.max(4, Math.min(60, Number(casePhysiology.respiratoryRate) || 14));
      const rightDepth = Math.max(0.25, Math.min(1, Number(casePhysiology.rightExpansionDepth) || 0.88));
      const leftDepth = Math.max(0.25, Math.min(1, Number(casePhysiology.leftExpansionDepth) || 0.88));
      const cycleDuration = 60000 / respiratoryRate;
      const inspirationFraction = 0.40;
      const symmetricDepth = Math.abs(rightDepth - leftDepth) <= 0.05;
      const cycleOrigin = performance.now();
      let finished = false;
      let lastRenderedPhase = "";

      openModal(`
        <section class="modal-card expansion-card" id="pulmonaryExpansionGame" role="dialog" aria-modal="true" aria-labelledby="pulmonaryExpansionTitle">
          <div class="modal-header"><h2 id="pulmonaryExpansionTitle">Chest Expansion</h2><button type="button" data-close aria-label="Close">X</button></div>
          <p class="expansion-instructions">Observe several breaths. Both sides share one respiratory rhythm; compare how deeply the right and left hemithoraces expand using the moving chest walls and excursion meters.</p>
          <div class="expansion-rhythm-hud" aria-live="polite">
            <div class="expansion-rate">${respiratoryRate} BREATHS / MIN</div>
            <div class="expansion-phase" id="expansionPhase">Inspiration</div>
          </div>
          <div class="expansion-stage">
            <canvas id="expansionCanvas" width="${canvasWidth}" height="${canvasHeight}" aria-describedby="expansionStatus" aria-label="Animated comparison of right and left pulmonary expansion"></canvas>
          </div>
          <div class="expansion-answer-row" aria-label="Choose the chest expansion finding">
            <button type="button" class="expansion-choice" data-expansion-answer="symmetric">= Symmetric depth</button>
            <button type="button" class="expansion-choice" data-expansion-answer="asymmetric">&#8800; Asymmetric depth</button>
          </div>
          <p class="expansion-status" id="expansionStatus" aria-live="polite">Watch the peak excursion on both meters, then choose the finding.</p>
        </section>
      `);

      document.querySelector(".game-root").classList.add("expansion-testing");
      const canvas = document.getElementById("expansionCanvas");
      const context = canvas.getContext("2d");
      const phaseLabel = document.getElementById("expansionPhase");
      const status = document.getElementById("expansionStatus");
      const answerButtons = Array.from(document.querySelectorAll("[data-expansion-answer]"));

      function easeInOut(value) {
        return 0.5 - (Math.cos(Math.PI * value) * 0.5);
      }

      function breathStateAt(timestamp) {
        const elapsed = Math.max(0, timestamp - cycleOrigin);
        const phase = (elapsed % cycleDuration) / cycleDuration;
        if (phase < inspirationFraction) {
          return {
            name: "inspiration",
            excursion: easeInOut(phase / inspirationFraction)
          };
        }
        return {
          name: "expiration",
          excursion: 1 - easeInOut((phase - inspirationFraction) / (1 - inspirationFraction))
        };
      }

      function setExpansionStatus(message, kind = "") {
        status.className = "expansion-status" + (kind ? " " + kind : "");
        status.textContent = message;
      }

      function drawMeter(x, depth, excursion, side) {
        const top = 132;
        const bottom = 372;
        const height = bottom - top;
        const fillHeight = Math.max(10, height * depth * excursion);
        context.fillStyle = "#101b22";
        context.fillRect(x - 17, top, 34, height);
        context.strokeStyle = "#d7ca93";
        context.lineWidth = 3;
        context.strokeRect(x - 17, top, 34, height);

        context.fillStyle = "#53a6b5";
        context.fillRect(x - 11, bottom - fillHeight, 22, fillHeight);
        context.fillStyle = "#aee6e6";
        context.fillRect(x - 7, bottom - fillHeight, 6, fillHeight);

        context.strokeStyle = "#f7edcf";
        context.lineWidth = 2;
        for (let index = 0; index <= 4; index += 1) {
          const tickY = bottom - ((height / 4) * index);
          context.beginPath();
          context.moveTo(x + 18, tickY);
          context.lineTo(x + 27, tickY);
          context.stroke();
        }

        const peakY = bottom - (height * depth);
        context.strokeStyle = "#ffdf72";
        context.lineWidth = 3;
        context.beginPath();
        context.moveTo(x - 24, peakY);
        context.lineTo(x + 24, peakY);
        context.stroke();

        context.fillStyle = "#f7edcf";
        context.font = '700 11px "Courier New", monospace';
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText("DEPTH", x, 111);
        context.fillText(side, x, 393);
      }

      function drawHemithorax(options) {
        const {
          medialX,
          outerX,
          direction,
          depth,
          excursion,
          labelX,
          label
        } = options;
        const displacement = 34 * depth * excursion;
        const movingOuterX = outerX + (direction * displacement);
        const lungCenterX = ((medialX + movingOuterX) / 2) - (direction * 6);
        const lungWidth = Math.abs(medialX - movingOuterX) * 0.56;
        const lungHeight = 215 + (26 * depth * excursion);
        const diaphragmY = 356 + (15 * depth * excursion);

        context.fillStyle = "#7d554b";
        context.fillRect(medialX - 11, 88, 22, 302);
        context.fillStyle = "#c89b78";
        for (let y = 98; y < 382; y += 28) {
          context.fillRect(medialX - 15, y, 30, 12);
        }

        context.fillStyle = "#c87859";
        context.strokeStyle = "#5b3031";
        context.lineWidth = 8;
        context.beginPath();
        context.moveTo(medialX, 76);
        context.bezierCurveTo(
          medialX + (direction * 58),
          72,
          movingOuterX - (direction * 18),
          105,
          movingOuterX,
          175
        );
        context.bezierCurveTo(
          movingOuterX + (direction * 8),
          264,
          movingOuterX - (direction * 10),
          354,
          medialX,
          414
        );
        context.lineTo(medialX, 76);
        context.closePath();
        context.fill();
        context.stroke();

        context.fillStyle = "#5a8994";
        context.strokeStyle = "#214953";
        context.lineWidth = 6;
        context.beginPath();
        context.ellipse(
          lungCenterX,
          240,
          lungWidth / 2,
          lungHeight / 2,
          direction * -0.06,
          0,
          Math.PI * 2
        );
        context.fill();
        context.stroke();

        context.fillStyle = "rgba(156,218,214,0.38)";
        context.beginPath();
        context.ellipse(
          lungCenterX - (direction * 9),
          222,
          lungWidth * 0.20,
          lungHeight * 0.35,
          direction * -0.06,
          0,
          Math.PI * 2
        );
        context.fill();

        context.strokeStyle = "#d9c696";
        context.lineWidth = 5;
        context.lineCap = "square";
        for (let index = 0; index < 6; index += 1) {
          const ribY = 126 + (index * 42);
          context.beginPath();
          context.moveTo(medialX, ribY);
          context.quadraticCurveTo(
            (medialX + movingOuterX) / 2,
            ribY - 21,
            movingOuterX - (direction * 10),
            ribY + 15
          );
          context.stroke();
        }

        context.strokeStyle = "#ffe1ad";
        context.lineWidth = 7;
        context.beginPath();
        context.moveTo(medialX, diaphragmY);
        context.quadraticCurveTo(
          (medialX + movingOuterX) / 2,
          diaphragmY - 35,
          movingOuterX - (direction * 12),
          diaphragmY
        );
        context.stroke();

        context.fillStyle = "rgba(17,24,32,0.82)";
        context.fillRect(labelX - 79, 28, 158, 30);
        context.fillStyle = "#f7edcf";
        context.font = '700 13px "Courier New", monospace';
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(label, labelX, 43);
      }

      function drawExpansionScene(timestamp) {
        const breath = breathStateAt(timestamp);
        context.imageSmoothingEnabled = false;
        context.fillStyle = "#223a44";
        context.fillRect(0, 0, canvasWidth, canvasHeight);
        context.fillStyle = "#2c4b55";
        for (let y = 0; y < canvasHeight; y += 20) {
