            ? "That is the compressed cord. Look for the eccentric structure displacing it from the left posterolateral side."
            : "That streak is artifact. Compare the contour around the left posterolateral cord.";
          hint.style.display = "block";
        });
      });
    }

    function openImagingReport() {
      openModal(`
        <section class="modal-card mini-card" role="dialog" aria-modal="true">
          <div class="modal-header"><h2>Imaging Report</h2><button type="button" data-close aria-label="Close">X</button></div>
          <p>The imaging confirms the syndrome selected in the EHR. Review the report before speaking with the patient.</p>
          <div class="report-sheet">
            <h3>MRI Thoracic Spine With and Without Contrast</h3>
            <dl>
              <div class="report-row"><dt>Level</dt><dd>Mid-thoracic cord, left posterolateral aspect.</dd></div>
              <div class="report-row"><dt>Finding</dt><dd>Enhancing intradural extramedullary mass with focal compression of the left hemicord.</dd></div>
              <div class="report-row"><dt>Correlation</dt><dd>Matches ipsilateral corticospinal and dorsal-column findings with contralateral pain-temperature loss.</dd></div>
            </dl>
            <p class="report-impression">Impression: left thoracic hemicord compression causing Brown-Sequard syndrome. Urgent neurosurgical evaluation is recommended.</p>
          </div>
          <div class="modal-actions"><button type="button" class="primary-action" id="beginFinalAssessment">Begin Final Assessment &amp; Plan</button></div>
        </section>
      `);

      document.getElementById("beginFinalAssessment").addEventListener("click", beginFinalAssessmentMode);
      setMinigameAutowin(beginFinalAssessmentMode);
    }

    function beginFinalAssessmentMode() {
      if (!has(state.completed, "imagingReportConfirmed")) markCompleted("imagingReportConfirmed");
      addFinding("finalDiagnosis");
      logAction("Confirmed Brown-Sequard syndrome from left thoracic cord compression");
      state.finalDialogueStep = 0;
      switchMusicTrack("final", true);
      renderFinalAssessmentStep();
    }

    function renderFinalAssessmentStep() {
      const stepIndex = state.finalDialogueStep;
      const step = finalAssessmentDialogue[stepIndex];
      if (!step) {
        completeFinalAssessment();
        return;
      }

      openModal(`
        <section class="final-assessment-mode" id="finalAssessmentMode" role="dialog" aria-modal="true" aria-labelledby="finalModeTitle">
          <header class="final-mode-heading"><strong id="finalModeTitle">Final Assessment and Plan</strong><span>Conversation ${stepIndex + 1} / ${finalAssessmentDialogue.length}</span></header>
          <div class="final-void">
            <figure class="final-patient-frame"><img src="assets/patient-portrait.png" alt="The patient listening in the darkened conversation view"></figure>
            <section class="final-dialogue-panel">
              <div class="final-progress" aria-hidden="true">${finalAssessmentDialogue.map((item, index) => `<span class="${index < stepIndex ? "complete" : ""}"></span>`).join("")}</div>
              <p class="final-speaker">Patient</p>
              <p class="final-prompt">${escapeHtml(step.patient)}</p>
              <div class="final-options">
                ${step.options.map((option, index) => `<button type="button" class="final-choice" data-final-choice="${index}">${escapeHtml(option.text)}</button>`).join("")}
              </div>
              <p class="final-response" id="finalResponse" aria-live="polite" hidden></p>
              <button type="button" class="primary-action final-continue" id="finalContinue" hidden>${stepIndex === finalAssessmentDialogue.length - 1 ? "Complete Plan" : "Continue"}</button>
            </section>
          </div>
        </section>
      `);

      const root = document.getElementById("modalRoot");
      root.className = "modal-backdrop open final-mode-backdrop";
      const response = document.getElementById("finalResponse");
      const continueButton = document.getElementById("finalContinue");

      document.querySelectorAll("[data-final-choice]").forEach(button => {
        button.addEventListener("click", () => {
          const option = step.options[Number(button.dataset.finalChoice)];
          if (!option.correct) {
            response.hidden = false;
            response.className = "final-response retry";
            response.textContent = option.feedback;
            return;
          }

          document.querySelectorAll("[data-final-choice]").forEach(item => { item.disabled = true; });
          response.hidden = false;
          response.className = "final-response";
          response.textContent = "Patient: \"" + step.response + "\"";
          continueButton.hidden = false;
          playSfx("success");
          continueButton.focus();
        });
      });

      continueButton.addEventListener("click", () => {
        state.finalDialogueStep += 1;
        renderFinalAssessmentStep();
      });
      setMinigameAutowin(completeFinalAssessment);
    }

    function completeFinalAssessment() {
      setMinigameAutowin(null);
      if (!has(state.completed, "finalAssessmentComplete")) markCompleted("finalAssessmentComplete");
      if (!has(state.completed, "caseComplete")) markCompleted("caseComplete");
      addFinding("neurosurgery");
      logAction("Completed Case 01 with an urgent, patient-centered assessment and plan");

      openModal(`
        <section class="final-assessment-mode" role="dialog" aria-modal="true" aria-labelledby="caseCompleteTitle">
          <header class="final-mode-heading"><strong>Final Assessment and Plan</strong><span>Case 01 complete</span></header>
          <div class="final-complete">
            <h2 id="caseCompleteTitle">Case 01 Complete</h2>
            <p>You recognized Brown-Sequard syndrome, confirmed left thoracic hemicord compression, and explained an urgent neurosurgical plan with honesty and empathy.</p>
          </div>
        </section>
      `);
      document.getElementById("modalRoot").className = "modal-backdrop open final-mode-backdrop";
    }

    document.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;
      if (!(event.target instanceof Element)) return;
      if (event.target.closest("button, [data-hotspot], .inventory-item")) playSfx("click");
    }, true);

    document.querySelectorAll("[data-mode]").forEach(button => {
      button.addEventListener("click", () => {
        state.selectedInventoryId = "";
        state.mode = button.dataset.mode;
        render();
      });
    });

    document.querySelectorAll("[data-hotspot]").forEach(button => {
      button.addEventListener("click", () => handleHotspot(button.dataset.hotspot));
      button.addEventListener("dragover", event => {
        const types = Array.from(event.dataTransfer.types || []);
        if (!inventoryDrag.itemId && !types.includes("text/plain")) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        setInventoryDragTarget(button);
      });
      button.addEventListener("dragleave", () => {
        if (inventoryDrag.target === button) setInventoryDragTarget(null);
      });
      button.addEventListener("drop", event => {
        event.preventDefault();
        const itemId = event.dataTransfer.getData("text/plain") || inventoryDrag.itemId;
        clearSelectedInventory();
        clearInventoryDragVisuals();
        resetInventoryPointerDrag();
        handleInventoryUse(itemId, button.dataset.hotspot);
      });
    });

    function closeToolbarMenus(except = null) {
      document.querySelectorAll(".toolbar-menu").forEach(menu => {
        if (menu === except) return;
        menu.classList.remove("open");
        menu.querySelector(".menu-panel").hidden = true;
        menu.querySelector(".toolbar-menu-button").setAttribute("aria-expanded", "false");
      });
    }

    document.querySelectorAll("[data-menu-toggle]").forEach(button => {
      button.addEventListener("click", event => {
        event.stopPropagation();
        const menu = button.closest(".toolbar-menu");
        const shouldOpen = !menu.classList.contains("open");
        closeToolbarMenus(shouldOpen ? menu : null);
        menu.classList.toggle("open", shouldOpen);
        menu.querySelector(".menu-panel").hidden = !shouldOpen;
        button.setAttribute("aria-expanded", String(shouldOpen));
      });
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".toolbar-menu")) closeToolbarMenus();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeToolbarMenus();
        clearSelectedInventory();
      }
    });

    document.querySelector("[data-help]").addEventListener("click", () => {
      closeToolbarMenus();
      openHelp();
    });
    document.querySelector("[data-level-select]").addEventListener("click", () => {
      closeToolbarMenus();
      openLevelSelect();
    });

    document.querySelector("[data-chart-review]").addEventListener("click", openChartReview);

    document.querySelector("[data-music-toggle]").addEventListener("click", event => {
      event.stopPropagation();
      toggleMusic();
    });

    document.querySelector("[data-music-volume]").addEventListener("input", event => {
      setMusicVolume(event.target.value);
    });

    document.querySelector("[data-sfx-volume]").addEventListener("input", event => {
      setSfxVolume(event.target.value);
    });

    document.querySelector("[data-sfx-test]").addEventListener("click", event => {
      event.stopPropagation();
      playSfx("success");
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "[" || event.repeat || !activeMinigameAutowin) return;
      if (event.target instanceof Element && event.target.closest("input, textarea, select, [contenteditable='true']")) return;
      event.preventDefault();
      const autowin = activeMinigameAutowin;
      activeMinigameAutowin = null;
      autowin();
    });

    document.getElementById("messageOk").addEventListener("click", closeMessagePopup);

    document.addEventListener("keydown", event => {
      const popup = document.getElementById("messagePopup");
      if (popup.hidden) return;
      if (event.key === "Escape" || event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        closeMessagePopup();
      }
    });

    document.getElementById("historyClose").addEventListener("click", closeHistoryDialogue);

    document.addEventListener("keydown", event => {
      if (document.getElementById("historyDialogue").hidden) return;
      if (event.key === "Escape") {
        closeHistoryDialogue();
        return;
      }
    });

    const cursor = document.getElementById("emojiCursor");
    document.querySelector(".game-root").addEventListener("pointermove", event => {
      cursor.style.left = event.clientX + "px";
      cursor.style.top = event.clientY + "px";
      cursor.classList.add("visible");
    });
    document.querySelector(".game-root").addEventListener("pointerleave", () => {
      cursor.classList.remove("visible");
    });

    render();
  </script>
</body>
</html>
